# 야!동하자 sync 서버 — Cloudflare Workers 배포 설정
# v2.5 — public 액세스 허용 (x-user 헤더 인증, 개발/프로토타입 단계)

name = "yadonghaja-sync-v2"
main = "src/worker-v2.5.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --- D1: 서버 저장소 (prod) ----------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "yadonghaja-sync-prod"
database_id = "09aeb553-184d-46ce-860a-dcab5aadac18"

# --- R2: 세그먼트·Blob(인증 사진) 바이트 저장 ------------------------------
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yadonghaja-blobs-prod"

# --- 시크릿 (v2.5는 vars 로 전달) ---------------------------------------
vars = { SYNC_HMAC_KEY = "***REMOVED_SYNC_HMAC_KEY***" }
# R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY 는 프로덕션에서 secret 사용

# --- Durable Objects 는 v2.6 에서 추가 (실시간 동기화) -------------------
