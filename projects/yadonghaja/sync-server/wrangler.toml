# 야!동하자 sync 서버 — Cloudflare Workers 배포 설정
# 패키지 레퍼런스: syncular-analysis/packages/server-workers/wrangler.toml.example

name = "yadonghaja-sync-v2"  # v2.5 — 새 이름 (DO 문제 회피)
main = "src/worker-v2.4.js"  # v2.4 — health/sync/segments/blobs
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# --- D1: 서버 저장소 (D1ServerStorage) --------------------------------------
# 본계정 (v2.5 prod)
[[d1_databases]]
binding = "DB"
database_name = "yadonghaja-sync-prod"
database_id = "c8ac479a-2cd5-4064-a2a5-7cc6171e1cc6"

# --- R2: 세그먼트·Blob(인증 사진) 바이트 저장 --------------------------------
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yadonghaja-blobs-prod"

# --- 시크릿 (개발용: 직접 기입, 프로덕션에서는 wrangler secret 사용) --------
vars = { SYNC_HMAC_KEY = "2ad4e9489b888d4af76d3588fd9f4d58" }
# R2_ACCOUNT_ID = "56f2f60bdba5a9bf7f58478a14a4ed90"
# R2_ACCESS_KEY_ID = "..."
# R2_SECRET_ACCESS_KEY = "..."

