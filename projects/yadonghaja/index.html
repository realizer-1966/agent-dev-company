/* PWA 라벨 수정: OnDev 호스팅이 manifest 링크를 자체 manifest.webmanifest(short_name=앱아이디)로
   치환함 → Android 홈 라벨이 'yadonghaja'로 표시됨. 런타임에 우리 매니페스트(site.webmanifest,
   name/short_name=야!동하자)로 되돌려 설치 라벨을 한국어로 유지한다. */
(function fixManifestLink() {
  try {
    const ours = document.querySelector('link[rel="manifest"][href*="site.webmanifest"]');
    if (ours) return; // 이미 우리 링크면 통과
    document.querySelectorAll('link[rel="manifest"]').forEach(l => l.remove());
    const l = document.createElement('link');
    l.rel = 'manifest';
    l.href = 'site.webmanifest';
    document.head.appendChild(l);
  } catch (e) { /* manifest 교체 실패는 앱 동작에 영향 없음 */ }
})();

const pad = n => String(n).padStart(2,'0');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const dateStr = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

const fmtClock = iso => { const d = new Date(iso); return pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); };
const fmtDay = iso => iso ? iso.slice(0,10).replace(/-/g,'.') : '';
const daysBetween = (a,b) => Math.floor((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
const addDaysStr = (s,n) => { const d = new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return dateStr(d); };
function hash(str) { let h = 5381; for (let i=0;i<str.length;i++) h = ((h<<5)+h+str.charCodeAt(i))>>>0; return h; }
function mondayOf(d) { const x = new Date(d); const day = (x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function weekKeyOf(d) { const m = mondayOf(d || new Date()); return m.getFullYear()+'-'+pad(m.getMonth()+1)+'-'+pad(m.getDate()); }

/* ---------- IndexedDB ---------- */
let db = null;
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('profile'))  d.createObjectStore('profile',  { keyPath:'id' });
      if (!d.objectStoreNames.contains('missions')) d.createObjectStore('missions', { keyPath:'id', autoIncrement:true });
      if (!d.objectStoreNames.contains('verifs'))   d.createObjectStore('verifs',   { keyPath:'id', autoIncrement:true });
      if (!d.objectStoreNames.contains('feed'))     d.createObjectStore('feed',     { keyPath:'id', autoIncrement:true });
      if (!d.objectStoreNames.contains('posts'))    d.createObjectStore('posts',    { keyPath:'id', autoIncrement:true });
      if (!d.objectStoreNames.contains('apps'))     d.createObjectStore('apps',      { keyPath:'id', autoIncrement:true });
      if (!d.objectStoreNames.contains('badges'))   d.createObjectStore('badges',   { keyPath:'id' });
      if (!d.objectStoreNames.contains('ledger'))   d.createObjectStore('ledger',   { keyPath:'id', autoIncrement:true });
      if (!d.objectStoreNames.contains('kv'))       d.createObjectStore('kv',        { keyPath:'k' });
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}
function tx(store, mode) { return db.transaction(store, mode).objectStore(store); }
function dbAll(store)  { return new Promise((res, rej) => { const r = tx(store,'readonly').getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function dbGet(store, key) { return new Promise((res, rej) => { const r = tx(store,'readonly').get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function dbPut(store, obj) { return new Promise((res, rej) => { const r = tx(store,'readwrite').put(obj); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function dbAdd(store, obj) { return new Promise((res, rej) => { const r = tx(store,'readwrite').add(obj); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function dbDel(store, key) { return new Promise((res, rej) => { const r = tx(store,'readwrite').delete(key); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
function dbClear(store) { return new Promise((res, rej) => { const r = tx(store,'readwrite').clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }

/* ---------- 상태 ---------- */
const S = { profile:null, missions:[], verifs:[], feed:[], posts:[], apps:[], badges:[], ledger:[], kv:{} };
let activeTab = 'home';

function saveProfile()  { return dbPut('profile', S.profile); }
function saveFeedItem(f){ return dbPut('feed', f); }
function savePost(p)    { return dbPut('posts', p); }

async function loadAll() {
  S.profile  = await dbGet('profile','me');
  S.missions = await dbAll('missions');
  S.verifs   = await dbAll('verifs');
  S.feed     = await dbAll('feed');
  S.posts    = await dbAll('posts');
  S.apps     = await dbAll('apps');
  S.badges   = await dbAll('badges');
  S.ledger   = await dbAll('ledger');
  (await dbAll('kv')).forEach(k => S.kv[k.k] = k.v);
  if (!S.profile) { await firstRunSeed(); }
  else if (!S.kv.seedv2) { await seedV2Migrate(); }
}

  const newPosts = [

    { types:['스크린골프'], mode:'오프라인', region:'경기', days:[5,6], timeSlot:'점심', capacity:4, joined:1, intro:'주말 점심 스크린골프 18홀! 스코어 신경 안 써도 돼요', authorName:'황골퍼', authorAvatar:'⛳', mine:false, createdAt:nowISO(), deadline:addDaysStr(todayStr(),10) },
  ];
  for (const p of newPosts) { p.id = await dbAdd('posts', p); S.posts.push(p); }
  await dbPut('kv', { k:'seedv2', v:1 });
}

/* ---------- 포인트 / 레벨 / 배지 ---------- */
function levelOf(points) {
  let cur = LEVELS[0];
  for (const l of LEVELS) if (points >= l.need) cur = l;
  return cur;
}
function nextLevel(points) { return LEVELS.find(l => l.need > points) || null; }

async function addPoints(amount, reason) {
  const before = levelOf(S.profile.points).lv;
  S.profile.points += amount;
  // 주간 리셋 체크
  if (S.profile.weekKey !== weekKeyOf()) { S.profile.weekKey = weekKeyOf(); S.profile.weeklyPoints = 0; }
  S.profile.weeklyPoints += amount;
  await dbAdd('ledger', { amount, reason, createdAt:nowISO() });
  await saveProfile();
  const after = levelOf(S.profile.points).lv;
  if (after > before) showToast('🎉 레벨업! ' + levelOf(S.profile.points).name);
  renderHeader();
}

const badgeQueue = [];
async function checkBadges() {
  for (const b of BADGES) {
    if (S.badges.some(x => x.id === b.id)) continue;
    if (b.check(S)) {
      const rec = { id:b.id, earnedAt:nowISO() };
      await dbPut('badges', rec); S.badges.push(rec);
      if (BADGE_BONUS[b.id]) await addPoints(BADGE_BONUS[b.id], '배지 보너스: '+b.name);
      badgeQueue.push(b);
    }
  }
  if (badgeQueue.length) showNextBadge();
}
function showNextBadge() {
  const pop = $('badgePop');
  if (pop.classList.contains('flex') && !pop.classList.contains('hidden')) return; // 이미 표시 중
  const b = badgeQueue.shift();
  if (!b) return;
  $('badgePopIcon').textContent = b.icon;
  $('badgePopName').textContent = b.name;
  $('badgePopDesc').textContent = b.desc;
  pop.classList.remove('hidden'); pop.classList.add('flex');
  setTimeout(() => { pop.classList.add('hidden'); pop.classList.remove('flex'); setTimeout(showNextBadge, 250); }, 2200);
}

/* ---------- 스트릭 ---------- */
function currentStreak() {
  const p = S.profile;
  if (!p.lastVerifyDate) return p.streak;
  const t = todayStr(), y = yesterdayStr();
  if (p.lastVerifyDate === t || p.lastVerifyDate === y) return p.streak;
  return 0;
}
async function onVerifyStreak() {
  const p = S.profile, t = todayStr(), y = yesterdayStr();
  if (p.lastVerifyDate === t) { /* 오늘 이미 인증함 */ }
  else if (p.lastVerifyDate === y) p.streak += 1;
  else p.streak = 1;
  p.lastVerifyDate = t;
  if (p.streak > p.streakBest) p.streakBest = p.streak;
  p.brokenStreak = 0; p.brokenDate = '';
  await saveProfile();
}

/* ---------- 미션 생성 ---------- */
function dailyMissionsFor(date) {
  const p = S.profile;
  const interest = (p.interests && p.interests[0]) || '홈트';
  const specific = TYPE_TEMPLATES[interest] || TYPE_TEMPLATES['홈트'];
  const pick1 = specific[hash(date+interest)%specific.length];
  const pool = COMMON_TEMPLATES.filter(t => t !== pick1);
  const pick2 = pool[hash(date+'c2')%pool.length];
  const pick3 = pool[hash(date+'c3')%pool.length];
  return [pick1, pick2, pick3].map(title => ({ date, kind:'daily', title, status:'pending', verifiedAt:null }));
}
async function ensureDailyMissions() {
  const t = todayStr();
  const have = S.missions.filter(m => m.kind === 'daily' && m.date === t);
  if (have.length >= 3) return;
  for (let i = have.length; i < 3; i++) {
    const m = dailyMissionsFor(t)[i];
    m.id = await dbAdd('missions', m); S.missions.push(m);
  }
}
async function ensureWeeklyChallenge() {
  const wk = weekKeyOf();
  if (S.missions.some(m => m.kind === 'weekly' && m.weekKey === wk)) return;
  const m = { kind:'weekly', weekKey:wk, title:'이번 주 4일 인증', goal:4, status:'pending', verifiedAt:null };
  m.id = await dbAdd('missions', m); S.missions.push(m);
}
function weekVerifyCount() {
  const monday = weekKeyOf();
  const days = new Set(S.verifs.filter(v => v.mine && v.date >= monday).map(v => v.date));
  return days.size;
}
function myGroups() {
  const mine = S.posts.filter(p => p.mine);
  const joined = S.posts.filter(p => !p.mine && S.apps.some(a => a.postId === p.id && a.mineApply && a.status === 'accepted'));
  return [...mine, ...joined];
}
function groupMembers(p) {
  if (p.mine) {
    return S.apps.filter(a => a.postId === p.id && a.status === 'accepted').map(a => ({ name:a.name, avatar:a.avatar }));
  }
  const members = [{ name:p.authorName, avatar:p.authorAvatar }];
  const n = 1 + hash(weekKeyOf()+p.authorName)%3;
  for (let i=0;i<n;i++) { const u = SEED_USERS[hash(p.authorName+'m'+i)%SEED_USERS.length]; members.push({ name:u.name, avatar:u.avatar }); }
  return members;
}
async function ensureGroupMission() {
  const wk = weekKeyOf();
  if (S.missions.some(m => m.kind === 'group' && m.weekKey === wk)) return;
  if (myGroups().length === 0) return;
  const m = { kind:'group', weekKey:wk, title:'우리 그룹 이번 주 인증 12회', goal:12, status:'pending', verifiedAt:null };
  m.id = await dbAdd('missions', m); S.missions.push(m);
}
function groupProgress() {
  let mine = 0;
  const monday = weekKeyOf();
  S.verifs.forEach(v => { if (v.mine && v.date >= monday) mine++; });
  let sim = 0;
  myGroups().forEach(p => groupMembers(p).forEach(m => { if (m.name !== S.profile.name) sim += hash(weekKeyOf()+m.name)%4; }));
  return { mine, sim, total: mine + sim };
}

/* ---------- 미션 체크 ---------- */
async function checkMissionCompletions() {
  const wk = weekKeyOf();
  const weekly = S.missions.find(m => m.kind === 'weekly' && m.weekKey === wk);
  if (weekly && weekly.status !== 'done' && weekVerifyCount() >= weekly.goal) {
    weekly.status = 'done'; weekly.verifiedAt = nowISO(); await dbPut('missions', weekly);
    await addPoints(50, '주간 챌린지 달성'); showToast('🏆 주간 챌린지 달성! +50P');
  }
  const group = S.missions.find(m => m.kind === 'group' && m.weekKey === wk);
  if (group && group.status !== 'done' && groupProgress().total >= group.goal) {
    group.status = 'done'; group.verifiedAt = nowISO(); await dbPut('missions', group);
    S.profile.groupDone += 1; await saveProfile();
    await addPoints(50, '그룹 공동 미션 달성'); showToast('👥 그룹 공동 미션 달성! +50P');
  }
}

/* ---------- 인증 ---------- */
async function doVerify(missionId, photoDataUrl, memo) {
  const m = S.missions.find(x => x.id === missionId);
  if (!m || m.status === 'done') return;
  m.status = 'done'; m.verifiedAt = nowISO();
  await dbPut('missions', m);

  const date = todayStr();
  const v = { missionId:m.id, missionTitle:m.title, date, memo:memo||'', photoDataUrl:photoDataUrl||'', mine:true, createdAt:nowISO() };
  v.id = await dbAdd('verifs', v); S.verifs.push(v);

  const f = {
    userId:'me', userName:S.profile.name, avatar:S.profile.avatar, mine:true, sample:false,
    missionTitle:m.title, memo:memo||'', photoDataUrl:photoDataUrl||'',
    createdAt:nowISO(), cheers:{ fire:0, thumb:0, muscle:0 }
  };
  f.id = await dbAdd('feed', f); S.feed.push(f);

  await onVerifyStreak();
  await addPoints(10, '일일 미션 인증: '+m.title);

  const t = todayStr();
  const todays = S.missions.filter(x => x.kind === 'daily' && x.date === t);
  if (todays.length === 3 && todays.every(x => x.status === 'done')) {
    await addPoints(20, '일일 미션 전부 완료 보너스');
    showToast('🌟 오늘의 미션 전부 완료! +20P');
  }
  await checkMissionCompletions();
  await checkBadges();
  scheduleDummyCheers(f.id);
  renderHeader();
  if (activeTab === 'home' || activeTab === 'mission') render();
}

/* 더미 메이트 응원 시뮬레이션 */
async function dummyCheer(feedId, silent) {
  const f = S.feed.find(x => x.id === feedId);

function scheduleDummyCheers(feedId) {

  for (let i=0;i<n;i++) setTimeout(() => dummyCheer(feedId, false), 3000 + i*4000 + Math.random()*5000);

/* ---------- 응원 보내기 ---------- */
async function sendCheer(feedId, emoji) {
  const t = todayStr();
  if (S.profile.cheerDate !== t) { S.profile.cheerDate = t; S.profile.cheerCount = 0; }
  if (S.profile.cheerCount >= 5) { showToast('오늘의 응원 포인트는 다 받았어요! 내일 또 응원해 주세요 💕'); return; }
  const f = S.feed.find(x => x.id === feedId);
  if (!f) return;
  f.cheers[emoji] = (f.cheers[emoji]||0) + 1;
  await saveFeedItem(f);
  S.profile.cheerCount += 1; S.profile.cheerTotal += 1;
  await saveProfile();
  await addPoints(1, '응원 보내기');
  const emojiIcon = { fire:'🔥', thumb:'👍', muscle:'💪' }[emoji];
  floatPoints('+1 P');
  if (S.profile.cheerCount === 5) showToast('오늘 응원 5회 완료! 내일 또 만나요 💕');

  render();
}

/* ---------- 홈 ---------- */

      html += '<div class="px-5 py-3 flex items-center justify-between border-t border-slate-700/60">'

        + (done ? '<span class="text-xs text-emerald-400 font-bold">인증완료</span>'

  html += '</div>';
  return html;
}
function typesLabel(types) { return (types||[]).map(t => (TYPE_INFO[t]||{emoji:''}).emoji+' '+t).join('·'); }
function calcRank() {
  const wk = weekKeyOf();
  const rows = [{ name:S.profile.name, avatar:S.profile.avatar, wp:S.profile.weeklyPoints, me:true }];
  SEED_USERS.forEach(u => rows.push({ name:u.name, avatar:u.avatar, wp: 20 + hash(wk+u.name)%160, me:false }));
  rows.sort((a,b) => b.wp - a.wp);
  return rows.findIndex(r => r.me) + 1;
}

async function saveName() {
  const v = $('nameInput').value.trim();
  if (!v) { showToast('이름을 입력해주세요'); return; }
  S.profile.name = v; await saveProfile(); showToast('이름을 저장했어요'); render();
}
async function toggleInterest(t) {
  const arr = S.profile.interests;
  const i = arr.indexOf(t);
  if (i >= 0) { if (arr.length === 1) { showToast('최소 1개는 선택해야 해요'); return; } arr.splice(i,1); }
  else arr.push(t);
  await saveProfile(); render();
}
async function saveNotify() {
  S.profile.notifyTime = $('notifyTime').value; await saveProfile(); showToast('알림 시간을 저장했어요');
}

/* ---------- 스트릭 복권 ---------- */
async function useLottery() {
  const p = S.profile;
  if (p.lotteryWeek === weekKeyOf()) return;
  p.streak = p.brokenStreak; p.brokenStreak = 0; p.brokenDate = '';
  p.lotteryWeek = weekKeyOf();
  p.lastVerifyDate = yesterdayStr(); // 어제 인증한 것으로 복구
  await saveProfile();
  showToast('복권 당첨! 🔥 '+p.streak+'일 스트릭을 되찾았어요');
  renderHeader(); render();
}

/* ---------- 탭 전환 ---------- */
function switchTab(name) {
  activeTab = name;
  document.querySelectorAll('.tabbtn').forEach(b => {
    const on = b.dataset.tab === name;
    b.className = 'tabbtn flex flex-col items-center justify-center gap-0.5 py-2 text-[10px] font-bold ' + (on ? 'text-orange-400' : 'text-slate-400');
  });
  $('fab').style.display = name === 'recruit' ? 'block' : 'none';
  try { history.replaceState(null, '', '#' + name); } catch(e) {}
  render();
}
function render() {
  const el = $('main');
  if (activeTab === 'home')    el.innerHTML = renderHome();
  if (activeTab === 'recruit') el.innerHTML = renderRecruit();
  if (activeTab === 'mission') el.innerHTML = renderMission();
  if (activeTab === 'feed')    el.innerHTML = renderFeed();
  if (activeTab === 'profile') el.innerHTML = renderProfile();
  const chk = $('onlineOnlyChk');
  if (chk) chk.onchange = e => { onlineOnly = e.target.checked; render(); };
}

function openSheet(title, bodyHtml) {
  $('sheetTitle').textContent = title;
  $('sheetBody').innerHTML = bodyHtml;
  $('sheetMask').classList.remove('hidden');
  $('sheet').classList.add('open');
}
function closeSheet() {
  $('sheetMask').classList.add('hidden');
  $('sheet').classList.remove('open');
}

/* ---------- 인증 시트 ---------- */
let verifyPhoto = '';
function openVerify(missionId) {
  const m = S.missions.find(x => x.id === missionId);
  if (!m || m.status === 'done') return;
  verifyPhoto = '';
  openSheet('미션 인증', ''
    + '<div class="space-y-4 pt-2">'
    + '<p class="text-sm font-bold text-orange-300">🎯 '+esc(m.title)+'</p>'
    + '<div id="photoPreview" class="hidden rounded-2xl overflow-hidden border border-slate-600"><img class="w-full max-h-56 object-cover" alt="미리보기"></div>'
    + '<div class="flex gap-2">'
    + '<button onclick="pickPhoto()" class="btn flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold text-sm py-3 rounded-xl">📷 사진 촬영/선택</button>'
    + '<button onclick="clearPhoto()" class="btn bg-slate-700 hover:bg-slate-600 text-white text-sm px-4 rounded-xl">지우기</button>'
    + '</div>'
    + '<textarea id="memoInput" maxlength="100" rows="2" placeholder="한 줄 소감 (선택) — 예: 오늘도 해냈다!" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-white text-sm resize-none"></textarea>'
    + '<p class="text-[11px] text-slate-500">사진 또는 소감 중 하나는 필수예요. 인증 즉시 +10P!</p>'
    + '<button onclick="submitVerify('+m.id+')" class="btn w-full bg-gradient-to-r from-orange-500 to-rose-500 text-white font-extrabold py-4 rounded-2xl text-base">✅ 인증 완료</button>'
    + '</div>');
}
function pickPhoto() { $('photoInput').value = ''; $('photoInput').click(); }
function clearPhoto() { verifyPhoto = ''; $('photoPreview').classList.add('hidden'); }
$('photoInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const MAX = 800;
      let w = img.width, h = img.height;
      if (w > MAX || h > MAX) { const r = Math.min(MAX/w, MAX/h); w = Math.round(w*r); h = Math.round(h*r); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      verifyPhoto = c.toDataURL('image/jpeg', 0.7);
      const pv = $('photoPreview');
      pv.querySelector('img').src = verifyPhoto;
      pv.classList.remove('hidden');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});
async function submitVerify(missionId) {
  const memo = $('memoInput').value.trim();
  if (!verifyPhoto && !memo) { showToast('사진이나 소감 중 하나는 남겨주세요!'); return; }
  closeSheet();
  floatPoints('+10 P');
  showToast('✅ 인증 완료! 피드에 올라갔어요');
  await doVerify(missionId, verifyPhoto, memo);
}

/* ---------- 모집글 시트 ---------- */

    + DAY_LABELS.map((d,i) => '<button onclick="toggleForm(\'days\','+i+')" data-d="'+i+'" class="chip bg-slate-700 text-slate-300">'+d+'</button>').join('')
    + '</div></div>'

    + '</div></div>'
    + '<div><p class="text-xs font-bold text-slate-400 mb-2">한 줄 소개</p>'

function toggleForm(kind, val) {
  const set = formState[kind];
  if (set.has(val)) set.delete(val); else set.add(val);
  const attr = kind === 'types' ? 't' : 'd';
  document.querySelectorAll('#form'+(kind==='types'?'Types':'Days')+' button').forEach(b => {
    const v = kind === 'types' ? b.dataset.t : Number(b.dataset.d);
    const on = set.has(v);
    b.className = 'chip ' + (on ? 'bg-orange-500 text-white' : 'bg-slate-700 text-slate-300');
  });
}
function setSlot(s) {
  formState.timeSlot = s;
  document.querySelectorAll('#formSlot button').forEach(b => {
    b.className = 'chip ' + (b.dataset.s === s ? 'bg-orange-500 text-white' : 'bg-slate-700 text-slate-300');
  });
}
async function savePost() {
  const types = [...formState.types];
  const days = [...formState.days];
  if (types.length === 0) { showToast('운동 종류를 1개 이상 선택해주세요'); return; }
  if (days.length === 0) { showToast('요일을 1개 이상 선택해주세요'); return; }
  const mode = $('formMode').value;
  const intro = $('formIntro').value.trim();
  if (!intro) { showToast('한 줄 소개를 적어주세요'); return; }
  const region = mode === '온라인' ? '온라인' : $('formRegion').value;
  const p = {
    types, mode, region, days, timeSlot:formState.timeSlot,
    capacity:Number($('formCap').value), joined:0, intro,
    authorName:S.profile.name, authorAvatar:S.profile.avatar, mine:true,
    createdAt:nowISO(), deadline:$('formDeadline').value || addDaysStr(todayStr(),7)
  };
  p.id = await dbAdd('posts', p); S.posts.push(p);
  closeSheet();
  showToast('🚀 모집글을 올렸어요! 메이트들이 신청하면 알려드릴게요');
  render();
  // 더미 메이트 신청 시뮬레이션
  const n = Math.min(p.capacity, 1 + Math.floor(Math.random()*2));
  for (let i=0;i<n;i++) setTimeout(() => dummyApply(p.id), 15000 + i*20000 + Math.random()*20000);
}
async function dummyApply(postId) {
  const p = S.posts.find(x => x.id === postId);
  if (!p || !p.mine) return;
  if (p.joined >= p.capacity) return;
  if (S.apps.filter(a => a.postId === postId && a.status !== 'rejected').length >= p.capacity) return;
  const u = rand(SEED_USERS);
  if (S.apps.some(a => a.postId === postId && a.name === u.name)) return;
  const app = { postId, name:u.name, avatar:u.avatar, status:'pending', mineApply:false, createdAt:nowISO() };
  app.id = await dbAdd('apps', app); S.apps.push(app);
  showToast('📨 '+esc(u.avatar+' '+u.name)+'님이 내 모집글에 신청했어요!');
  if (activeTab === 'recruit') render();
}

/* 모집글 상세 */
function openPost(postId) {
  const p = S.posts.find(x => x.id === postId);
  if (!p) return;
  const t = todayStr();
  const expired = p.deadline && p.deadline < t;
  const myApp = S.apps.find(a => a.postId === p.id && a.mineApply);
  const apps = S.apps.filter(a => a.postId === p.id);

  let body = '<div class="space-y-4 pt-2">'
    + '<div class="flex flex-wrap gap-2">'+p.types.map(typeBadge).join('')
    + (p.mode==='온라인'?'<span class="chip bg-sky-500/20 text-sky-300 text-xs">온라인</span>':'<span class="chip bg-slate-700 text-slate-200 text-xs">오프라인</span>')+'</div>'
    + '<p class="text-base font-bold text-white">'+esc(p.intro)+'</p>'
    + '<div class="bg-slate-900/70 rounded-xl p-4 space-y-1.5 text-sm text-slate-300">'
    + '<p>📍 지역: <b>'+esc(p.region)+'</b></p>'
    + '<p>🕐 시간대: <b>'+esc(p.timeSlot)+'</b> · '+dayChips(p.days)+'</p>'
    + '<p>👥 모집 인원: <b>'+p.joined+'/'+p.capacity+'명</b></p>'
    + '<p>✍️ 방장: '+esc(p.authorAvatar)+' '+esc(p.authorName)+(p.mine?' (나)':'')+'</p>'
    + '<p>⏰ 마감: <b>'+esc(p.deadline)+'</b>'+(expired?' (마감)':'')+'</p>'
    + '</div>';

  if (p.mine) {
    body += '<div><p class="text-xs font-bold text-slate-400 mb-2">신청 목록 ('+apps.length+')</p>';
    if (apps.length === 0) body += '<p class="text-sm text-slate-500 py-2">아직 신청이 없어요. 조금만 기다려보세요!</p>';
    apps.forEach(a => {
      body += '<div class="flex items-center justify-between bg-slate-900/70 rounded-xl px-3 py-2.5 mb-2">'
        + '<span class="text-sm font-bold text-slate-200">'+esc(a.avatar)+' '+esc(a.name)+'</span>'
        + (a.status === 'pending'
            ? '<span class="flex gap-2"><button onclick="decideApp('+a.id+',\'accepted\')" class="btn bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg">수락</button>'
              + '<button onclick="decideApp('+a.id+',\'rejected\')" class="btn bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-3 py-2 rounded-lg">거절</button></span>'
            : '<span class="text-xs font-bold '+(a.status==='accepted'?'text-emerald-400':'text-slate-500')+'">'+(a.status==='accepted'?'✅ 수락됨':'거절됨')+'</span>')
        + '</div>';
    });
    body += '</div>';
  } else {
    if (expired) body += '<p class="text-sm text-slate-500">마감된 모집글이에요.</p>';
    else if (myApp) body += '<p class="text-sm font-bold '+(myApp.status==='accepted'?'text-emerald-400':'text-amber-300')+'">'
      + (myApp.status==='accepted'?'✅ 가입 완료! 그룹 미션이 열렸어요':'⏳ 방장의 수락을 기다리고 있어요…')+'</p>';
    else if (p.joined >= p.capacity) body += '<p class="text-sm text-slate-500">모집 인원이 가득 찼어요.</p>';
    else body += '<button onclick="applyPost('+p.id+')" class="btn w-full bg-gradient-to-r from-orange-500 to-rose-500 text-white font-extrabold py-4 rounded-2xl">✋ 신청하기</button>';
  }
  body += '</div>';
  openSheet(p.mine?'내 모집글':'모집글 상세', body);
}
async function applyPost(postId) {
  const p = S.posts.find(x => x.id === postId);
  if (!p || p.joined >= p.capacity) { closeSheet(); return; }
  const app = { postId, name:S.profile.name, avatar:S.profile.avatar, status:'pending', mineApply:true, createdAt:nowISO() };
  app.id = await dbAdd('apps', app); S.apps.push(app);
  closeSheet();
  showToast('✋ 신청 완료! 방장이 수락하면 그룹이 열려요');
  render();
  // 방장 자동 수락 시뮬레이션 (6~14초)
  setTimeout(() => autoAccept(app.id), 6000 + Math.random()*8000);
}
async function autoAccept(appId) {
  const a = S.apps.find(x => x.id === appId);
  if (!a || !a.mineApply || a.status !== 'pending') return;
  const p = S.posts.find(x => x.id === a.postId);
  if (!p) return;
  a.status = 'accepted';
  await dbPut('apps', a);
  p.joined += 1;
  await savePost(p);
  showToast('🎉 '+esc(p.authorAvatar+' '+p.authorName)+'방장이 수락했어요! 그룹 미션이 열렸어요');
  await ensureGroupMission();
  render();
}
async function decideApp(appId, decision) {
  const a = S.apps.find(x => x.id === appId);
  if (!a || a.status !== 'pending') return;
  a.status = decision;
  await dbPut('apps', a);
  const p = S.posts.find(x => x.id === a.postId);
  if (p && decision === 'accepted') { p.joined += 1; await savePost(p); }
  if (decision === 'accepted') {
    showToast('✅ '+esc(a.name)+'님과 한 팀이 되었어요!');
    await ensureGroupMission();
  } else {
    showToast('신청을 거절했어요');
  }
  openPost(a.postId);
  if (activeTab === 'recruit' || activeTab === 'home') render();
}

/* ---------- 백업/복원/초기화 ---------- */
async function backup() {
  const data = {
    app:'yadonghaja', version:1, exportedAt:nowISO(),
    profile:S.profile, missions:S.missions, verifs:S.verifs, feed:S.feed,
    posts:S.posts, apps:S.apps, badges:S.badges, ledger:S.ledger
  };
  const blob = new Blob([JSON.stringify(data)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'yadong-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast('📤 백업 파일을 저장했어요');
}
function restore() { $('jsonInput').value = ''; $('jsonInput').click(); }
$('jsonInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const d = JSON.parse(ev.target.result);
      if (d.app !== 'yadonghaja' || !d.profile) throw new Error('잘못된 파일');
      for (const s of ['missions','verifs','feed','posts','apps','badges','ledger']) await dbClear(s);
      await dbClear('profile');
      await dbPut('profile', d.profile);
      for (const s of ['missions','verifs','feed','posts','apps','badges','ledger']) for (const it of (d[s]||[])) await dbPut(s, it);
      showToast('📥 복원 완료!');
      await loadAll(); boot(true);
    } catch (err) { showToast('복원 실패: 올바른 백업 파일이 아니에요'); }
  };
  reader.readAsText(file);
});
async function resetAll() {
  if (!confirm('모든 데이터를 삭제하고 처음부터 시작할까요? 되돌릴 수 없어요.')) return;
  for (const s of ['profile','missions','verifs','feed','posts','apps','badges','ledger','kv']) await dbClear(s);
  location.reload();
}

/* ---------- 라이트박스/토스트/플로팅 ---------- */
function openLightbox(src) { $('lightboxImg').src = src; $('lightbox').classList.remove('hidden'); $('lightbox').classList.add('flex'); }
function closeLightbox() { $('lightbox').classList.add('hidden'); $('lightbox').classList.remove('flex'); }
let toastTimer = null;
function showToast(msg) {
  const t = $('toast');
  t.innerHTML = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2600);
}
function floatPoints(text) {
  const el = document.createElement('div');
  el.className = 'points-float text-orange-400 text-2xl';
  el.style.left = '50%'; el.style.top = '40%';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

/* ---------- 부트 ---------- */
async function boot(isRestore) {
  const p = S.profile;
  // 주간 리셋
  const wk = weekKeyOf();
  if (p.weekKey !== wk) { p.weekKey = wk; p.weeklyPoints = 0; await saveProfile(); }
  // 스트릭 끊김 감지 → 복권 대상
  if (p.lastVerifyDate && p.streak > 0) {
    const gap = daysBetween(p.lastVerifyDate, todayStr());
    if (gap > 1) { p.brokenStreak = p.streak; p.streak = 0; p.brokenDate = todayStr(); await saveProfile(); }
  }
  await ensureDailyMissions();
  await ensureWeeklyChallenge();
  await ensureGroupMission();
  await checkMissionCompletions();
  await checkBadges();
  renderHeader();
  // 해시 라우팅
  const h = (location.hash || '').replace('#','');
  switchTab(['home','recruit','mission','feed','profile'].includes(h) ? h : 'home');
  // 이전 세션 미처리 신청 자동 수락 (내가 신청했던 것)
  S.apps.filter(a => a.mineApply && a.status === 'pending').forEach(a => {
    const gapMs = Date.now() - new Date(a.createdAt).getTime();
    if (gapMs > 20000) autoAccept(a.id);
  });
  // 최근 내 피드에 받은 응원 시뮬레이션 (재방문 환영)
  const recent = S.feed.filter(f => f.mine && (Date.now() - new Date(f.createdAt)) < 36*3600000);
  recent.forEach(f => {
    const total = f.cheers.fire + f.cheers.thumb + f.cheers.muscle;
    if (total === 0 && Math.random() < 0.5) dummyCheer(f.id, true);
  });
}
