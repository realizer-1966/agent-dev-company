[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-list"
version = "0.1.0"
description = "A simple CLI todo-list manager"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
]

[project.scripts]
todo = "todo_list.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
