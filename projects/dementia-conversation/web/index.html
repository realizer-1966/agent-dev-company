<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>마음이 — 대화 도우미</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#1e6f5c">
<style>
:root{
  --bg:#0f1a1f; --card:#17252c; --card2:#1e3038; --line:#2a4750;
  --txt:#f2f7f6; --dim:#9db4b8; --accent:#2fbf9b; --accent2:#e8a33d;
  --danger:#e0645a; --ok:#2fbf9b;
  --fs:20px;           /* accessibility base — 큰 글씨 */
  --tap:76px;          /* 최소 터치 높이 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,"Noto Sans KR",sans-serif;
  font-size:var(--fs); line-height:1.6;
  min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* 접근성: 글자 크기 조절 */
body.big{--fs:24px;--tap:88px}
body.huge{--fs:28px;--tap:96px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
h1{font-size:1.35em;margin:0;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.fsbtn{display:flex;gap:6px}
.fsbtn button{
  width:44px;height:44px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--txt);font-weight:700;font-size:.95em;
}
.fsbtn button.on{background:var(--accent);color:#08211b;border-color:var(--accent)}

.status{
  display:inline-flex;align-items:center;gap:7px;font-size:.75em;
  padding:6px 12px;border-radius:999px;background:var(--card);color:var(--dim);
  border:1px solid var(--line)
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.bad{background:var(--danger)}

/* 탭 */
nav{display:flex;gap:8px;margin:6px 0 14px}
nav button{
  flex:1;min-height:56px;border-radius:16px;border:1px solid var(--line);
  background:var(--card);color:var(--dim);font-size:.95em;font-weight:700;
  font-family:inherit
}
nav button.on{background:var(--accent);color:#08211b;border-color:var(--accent)}

section{display:none}
section.on{display:block}

/* 대화 말풍선 */
#log{display:flex;flex-direction:column;gap:12px;margin-bottom:14px;min-height:120px}
.bubble{
  max-width:88%;padding:14px 18px;border-radius:20px;
  font-size:1em;word-break:keep-all
}
.bubble.me{align-self:flex-end;background:var(--accent);color:#08211b;border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble .who{display:block;font-size:.7em;opacity:.75;margin-bottom:4px;font-weight:700}
.bubble.pending{opacity:.6;font-style:italic}
.empty{color:var(--dim);text-align:center;padding:26px 10px;font-size:.9em}

/* 큰 액션 버튼 */
.actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.big{
  width:100%;min-height:var(--tap);border-radius:20px;border:none;
  font-size:1.05em;font-weight:800;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--accent);color:#08211b
}
.big.alt{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.big.warn{background:var(--danger);color:#fff}
.big:disabled{opacity:.45}
.ico{font-size:1.25em}

/* 텍스트 입력 */
textarea,select,input[type=text]{
  width:100%;background:var(--card);color:var(--txt);
  border:1px solid var(--line);border-radius:16px;padding:14px;
  font-family:inherit;font-size:1em
}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:.78em;color:var(--dim);margin:12px 0 6px;font-weight:700}

.hint{font-size:.75em;color:var(--dim);margin-top:8px;line-height:1.5}
.row{display:flex;gap:8px}
.row>*{flex:1}

audio{width:100%;margin-top:12px;border-radius:14px}

details{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:12px 14px;margin-top:14px
}
summary{cursor:pointer;font-size:.85em;font-weight:700;color:var(--dim)}
details .body{padding-top:12px}

.rec{display:flex;align-items:center;gap:10px;justify-content:center}
.pulse{width:14px;height:14px;border-radius:50%;background:var(--danger);animation:p 1s infinite}
@keyframes p{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.35)}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>마음이 <span>대화 도우미</span></h1>
      <div class="status"><i class="dot" id="dot"></i><span id="stat">서버 확인 중…</span></div>
    </div>
    <div class="fsbtn">
      <button id="fs1" class="on" title="보통 크기">가</button>
      <button id="fs2" title="크게">가</button>
      <button id="fs3" title="아주 크게">가</button>
    </div>
  </header>

  <nav>
    <button class="on" data-t="talk">💬 대화</button>
    <button data-t="say">🔊 말하기</button>
    <button data-t="setup">⚙️ 설정</button>
  </nav>

  <!-- 대화 -->
  <section id="p-talk" class="on">
    <div id="log"><div class="empty">아래 <b>말하기</b> 버튼을 눌러<br>이야기를 시작하세요</div></div>
    <div class="actions">
      <button class="big" id="btnRec"><span class="ico">🎤</span><span id="recLabel">말하기</span></button>
      <button class="big alt" id="btnAgain"><span class="ico">🔁</span>다시 들려주기</button>
      <button class="big alt" id="btnClear"><span class="ico">🧹</span>대화 지우기</button>
    </div>
    <div class="hint">버튼을 누르고 <b>또박또박</b> 말씀하세요. 다시 누르면 멈춥니다.</div>
    <audio id="player" controls hidden></audio>
  </section>

  <!-- 말하기 (TTS) -->
  <section id="p-say">
    <label>하고 싶은 말을 적어 주세요</label>
    <textarea id="sayText" placeholder="예: 오늘 날씨가 참 좋네요"></textarea>
    <div class="actions" style="margin-top:12px">
      <button class="big" id="btnSay"><span class="ico">🔊</span>소리로 듣기</button>
    </div>
    <audio id="sayPlayer" controls style="margin-top:14px"></audio>
    <div class="hint">자주 쓰는 말은 아래 문장을 눌러 바로 들을 수 있어요.</div>
    <div id="phrases" style="margin-top:10px;display:flex;flex-direction:column;gap:8px"></div>
  </section>

  <!-- 설정 -->
  <section id="p-setup">
    <div class="status" style="display:flex;width:100%;border-radius:16px;padding:14px">
      <i class="dot" id="dot2"></i><span id="stat2">서버 확인 중…</span>
    </div>
    <label>서버 주소</label>
    <input type="text" id="apiBase" placeholder="http://127.0.0.1:8912">
    <div class="hint">
      서버를 켠 기기의 주소를 넣어 주세요.<br>
      <b>같은 폰에서 서버를 켰다면</b> <code>http://127.0.0.1:8912</code><br>
      <b>같은 와이파이의 PC 라면</b> <code>http://192.168.0.10:8912</code> (PC의 IP)
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="big alt" id="btnSave">저장하고 연결 확인</button>
    </div>

    <details>
      <summary>음성 모델 자세히</summary>
      <div class="body">
        <label>말하는 목소리</label>
        <select id="voice"></select>
        <label>인식 언어</label>
        <select id="lang">
          <option value="ko" selected>한국어</option>
          <option value="en">영어</option>
          <option value="ja">일본어</option>
        </select>
        <div class="hint">바꾼 뒤 <b>저장하고 연결 확인</b>을 눌러 주세요.</div>
      </div>
    </details>
  </section>

</div>

<script>
/* ── 상태 ────────────────────────────────────────────── */
const LS = {
  get api(){ return localStorage.getItem('dc_api') || '' },
  set api(v){ localStorage.setItem('dc_api', v) },
  get voice(){ return localStorage.getItem('dc_voice') || 'M1' },
  set voice(v){ localStorage.setItem('dc_voice', v) },
  get lang(){ return localStorage.getItem('dc_lang') || 'ko' },
  set lang(v){ localStorage.setItem('dc_lang', v) },
  get fs(){ return localStorage.getItem('dc_fs') || '1' },
  set fs(v){ localStorage.setItem('dc_fs', v) },
};
const TTS_MODEL = 'supertonic-ko';
const ASR_MODEL = 'qwen3-asr';

let apiBase = LS.api;
let talking = false;          // 녹음 중
let lastReply = '';           // 다시 듣기용

/* ── 글자 크기 ───────────────────────────────────────── */
function applyFs(n){
  document.body.classList.remove('big','huge');
  if(n === '2') document.body.classList.add('big');
  if(n === '3') document.body.classList.add('huge');
  ['fs1','fs2','fs3'].forEach((id,i)=>
    document.getElementById(id).classList.toggle('on', String(i+1) === n));
  LS.fs = n;
}
['fs1','fs2','fs3'].forEach((id,i)=>
  document.getElementById(id).onclick = () => applyFs(String(i+1)));

/* ── 탭 ─────────────────────────────────────────────── */
document.querySelectorAll('nav button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('section').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('p-' + b.dataset.t).classList.add('on');
    if (b.dataset.t === 'setup') refreshStatus();
  };
});

/* ── 대화 기록 ──────────────────────────────────────── */
const logEl = document.getElementById('log');
let history = [];   // {who:'me'|'ai', text}

function render(){
  if (!history.length){
    logEl.innerHTML = '<div class="empty">아래 <b>말하기</b> 버튼을 눌러<br>이야기를 시작하세요</div>';
    return;
  }
  logEl.innerHTML = history.map(h =>
    `<div class="bubble ${h.who}">` +
    `<span class="who">${h.who === 'me' ? '어르신' : '마음이'}</span>` +
    `${escapeHtml(h.text)}</div>`).join('');
  logEl.lastElementChild?.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function push(who, text){ history.push({who, text}); render(); }

document.getElementById('btnClear').onclick = () => {
  if (history.length && !confirm('대화 내용을 모두 지울까요?')) return;
  history = []; lastReply = ''; render();
  const p = document.getElementById('player'); p.hidden = true; p.src = '';
};

/* ── 서버 상태 ──────────────────────────────────────── */
function setDot(state, msg){
  ['dot','dot2'].forEach(id => {
    const d = document.getElementById(id);
    if (d) d.className = 'dot' + (state === 'ok' ? ' ok' : state === 'bad' ? ' bad' : '');
  });
  ['stat','stat2'].forEach(id => {
    const s = document.getElementById(id);
    if (s) s.textContent = msg;
  });
}
async function refreshStatus(){
  if (!apiBase){ setDot('bad','서버 주소를 먼저 넣어 주세요'); return false; }
  setDot('', '확인 중…');
  try {
    const r = await fetch(apiBase + '/health', {signal:AbortSignal.timeout(8000)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    setDot('ok', `연결됨 · 모델 ${j.models ?? '?'}개`);
    return true;
  } catch(e){
    setDot('bad', '서버에 연결할 수 없어요');
    return false;
  }
}

/* ── TTS ────────────────────────────────────────────── */
async function speak(text, playerId){
  const pl = document.getElementById(playerId);
  pl.hidden = false;
  try {
    const r = await fetch(apiBase + '/v1/audio/speech', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model: TTS_MODEL, input: text,
        voice: LS.voice, response_format: 'wav'
      }),
      signal: AbortSignal.timeout(180000)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const blob = await r.blob();
    if (blob.size < 1000) throw new Error('빈 오디오');
    pl.src = URL.createObjectURL(blob);
    await pl.play().catch(()=>{});
    return true;
  } catch(e){
    push('ai', '소리를 만들지 못했어요. 서버를 확인해 주세요.');
    return false;
  }
}

/* ── ASR: 녹음 → 전송 → 응답 ────────────────────────── */
let mediaRec, chunks = [];
const recLabel = document.getElementById('recLabel');
const btnRec = document.getElementById('btnRec');

btnRec.onclick = async () => {
  if (talking) return stopRec();
  if (!apiBase){ alert('설정에서 서버 주소를 먼저 넣어 주세요.'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec = new MediaRecorder(stream);
    chunks = [];
    mediaRec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mediaRec.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, {type: mediaRec.mimeType || 'audio/webm'});
      if (blob.size < 1200){ push('ai', '소리가 너무 짧았어요.'); return; }
      await sendToServer(blob);
    };
    mediaRec.start();
    talking = true;
    btnRec.classList.add('warn');
    recLabel.textContent = '듣는 중… (눌러서 멈춤)';
    document.getElementById('btnRec').firstElementChild.className = '';
  } catch(e){
    push('ai','마이크를 쓸 수 없어요. 권한을 허용해 주세요.');
  }
};

function stopRec(){
  if (mediaRec && mediaRec.state !== 'inactive') mediaRec.stop();
  talking = false;
  btnRec.classList.remove('warn');
  recLabel.textContent = '말하기';
}

async function sendToServer(blob){
  push('me', '🎤 (말씀하시는 중…)');
  const pend = logEl.lastElementChild;
  try {
    // 서버는 WAV 를 받는다. 브라우저 녹음(webm/ogg)은 서버 프론트엔드가
    // ffmpeg 모듈 없이 처리 못 할 수 있으므로 16-bit WAV 로 직접 변환한다.
    const wav = await toWav(blob);
    const fd = new FormData();
    fd.append('model', ASR_MODEL);
    fd.append('language', LS.lang);
    fd.append('file', wav, 'speech.wav');

    const r = await fetch(apiBase + '/v1/audio/transcriptions', {
      method:'POST', body: fd, signal: AbortSignal.timeout(180000)
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const text = (j.text || '').trim();

    // 자리표시자 제거 후 실제 발화로 교체
    pend?.remove();
    history.pop();
    if (!text){
      push('ai', '잘 못 들었어요. 다시 한 번 말씀해 주세요.');
      return;
    }
    push('me', text);
    const reply = makeReply(text);
    push('ai', reply);
    lastReply = reply;
    await speak(reply, 'player');
  } catch(e){
    pend?.remove(); history.pop(); render();
    push('ai', '알아듣지 못했어요. 다시 시도해 주세요.');
    if (!history.length) render();
  }
}

/* 다시 듣기 */
document.getElementById('btnAgain').onclick = () => {
  if (!lastReply){ push('ai','아직 들려드릴 말이 없어요.'); return; }
  speak(lastReply, 'player');
};

/* 녹음 blob → 16-bit mono WAV (16k 리샘플) */
async function toWav(blob, targetRate = 16000){
  const buf = await blob.arrayBuffer();
  const decoded = await new AudioContext().decodeAudioData(buf.slice(0));

  // OfflineAudioContext 로 16k mono 렌더 (서버 ASR 요구 형식)
  const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetRate), targetRate);
  const s = off.createBufferSource();
  s.buffer = decoded; s.connect(off.destination); s.start();
  const rendered = await off.startRendering();
  const data = rendered.getChannelData(0);

  const n = data.length;
  const out = new ArrayBuffer(44 + n * 2);
  const v = new DataView(out);
  const wr = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  wr(0,'RIFF'); v.setUint32(4, 36 + n*2, true); wr(8,'WAVE'); wr(12,'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, targetRate, true); v.setUint32(28, targetRate*2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  wr(36,'data'); v.setUint32(40, n*2, true);
  for (let i = 0; i < n; i++){
    const s2 = Math.max(-1, Math.min(1, data[i]));
    v.setInt16(44 + i*2, s2 < 0 ? s2*0x8000 : s2*0x7fff, true);
  }
  return new Blob([out], {type:'audio/wav'});
}

/* ── 응답 생성 (오프라인 규칙 기반, 외부 전송 없음) ── */
const RULES = [
  {k:['안녕','반가'],     t:'어르신, 안녕하세요. 오늘 기분은 어떠세요?'},
  {k:['날씨'],           t:'오늘 날씨 이야기를 해 주셨네요. 산책하기 좋은 날이에요.'},
  {k:['밥','식사','먹었'], t:'식사는 하셨어요? 따뜻한 국물이 좋겠어요.'},
  {k:['아들','딸','자식','손자','손녀'], t:'가족 생각이 나셨군요. 많이 보고 싶으시겠어요.'},
  {k:['아프','통증','병원','약'], t:'몸이 불편하시면 가족에게 꼭 말씀해 주세요.'},
  {k:['잠','잤','졸려'],  t:'푹 주무시는 게 제일 중요해요. 낮에 잠깐 쉬어 보세요.'},
  {k:['고맙','감사'],     t:'천만에요, 어르신. 제가 곁에 있을게요.'},
  {k:['힘들','외로','슬퍼','우울'], t:'마음이 힘드시군요. 이야기를 들려주셔서 고마워요.'},
  {k:['음악','노래'],     t:'노래를 좋아하시는군요. 좋아하시는 노래가 있으세요?'},
  {k:['산책','걷'],       t:'산책은 몸과 마음에 참 좋아요. 천천히 다녀오세요.'},
];
function makeReply(text){
  const hit = RULES.find(r => r.k.some(k => text.includes(k)));
  const base = hit ? hit.t
    : `“${text}” 라고 말씀하셨네요. 조금 더 들려주시겠어요?`;
  const hour = new Date().getHours();
  const greet = hour < 12 ? '아침' : hour < 18 ? '오후' : '저녁';
  return Math.random() < 0.35 ? `${greet}이네요. ${base}` : base;
}

/* ── 자주 쓰는 문장 ─────────────────────────────────── */
const PHRASES = [
  '물 한 잔 드릴까요?',
  '지금 몇 시예요?',
  '오늘 날씨가 참 좋네요.',
  '가족이 곧 오실 거예요.',
  '천천히 하셔도 괜찮아요.',
];
document.getElementById('phrases').innerHTML = PHRASES
  .map((p,i) => `<button class="big alt" data-p="${i}" style="min-height:64px;font-weight:600;font-size:.95em">🔊 ${p}</button>`)
  .join('');
document.querySelectorAll('#phrases button').forEach(b => {
  b.onclick = () => speak(PHRASES[+b.dataset.p], 'sayPlayer');
});

/* ── 설정 ───────────────────────────────────────────── */
const apiInput = document.getElementById('apiBase');
const voiceSel = document.getElementById('voice');
const langSel  = document.getElementById('lang');
apiInput.value = LS.api;
langSel.value  = LS.lang;

// 목소리 목록 (Supertonic 내장 M1~M5 / F1~F5)
const VOICES = ['M1','M2','M3','M4','M5','F1','F2','F3','F4','F5'];
voiceSel.innerHTML = VOICES.map(v =>
  `<option value="${v}"${v === LS.voice ? ' selected' : ''}>${
    v[0] === 'M' ? '남성' : '여성'} ${v[1]}</option>`).join('');

document.getElementById('btnSave').onclick = async () => {
  LS.api = apiInput.value.trim().replace(/\/+$/, '');
  apiBase = LS.api;
  LS.voice = voiceSel.value;
  LS.lang = langSel.value;
  const ok = await refreshStatus();
  if (ok) alert('연결되었습니다. 이제 대화를 시작할 수 있어요.');
};

document.getElementById('btnSay').onclick = () => {
  const t = document.getElementById('sayText').value.trim();
  if (!t){ alert('먼저 하고 싶은 말을 적어 주세요.'); return; }
  speak(t, 'sayPlayer');
};

/* ── 시작 ───────────────────────────────────────────── */
applyFs(LS.fs);
if (apiBase) refreshStatus(); else setDot('bad','설정에서 서버 주소를 넣어 주세요');
</script>
</body>
</html>
