[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "glowscript-llm"
version = "0.1.0"
description = "FastAPI LLM proxy backend that generates GlowScript/VPython code from natural-language descriptions"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "httpx",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "httpx2>=0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
