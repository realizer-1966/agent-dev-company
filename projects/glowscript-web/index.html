<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GlowScript 시뮬레이터</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .sim-btn { transition: all .15s ease; }
  .sim-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .sim-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
  #glowscript { width: 100%; min-height: 60vw; max-height: 70vh; }
  #glowscript canvas { border-radius: 12px; width: 100% !important; height: auto !important; }

  /* Mobile-friendly horizontal scroll for sim buttons */
  #simButtons {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 0.5rem;
    scroll-snap-type: x proximity;
  }
  #simButtons a {
    flex-shrink: 0;
    scroll-snap-align: start;
    min-height: 2.75rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  /* Mobile param panel: collapsible on small screens */
  #paramPanel input[type=range] { height: 2rem; cursor: pointer; }

  /* Touch-friendly buttons */
  button { -webkit-tap-highlight-color: transparent; }
  .touch-btn { min-height: 2.75rem; }

  @media (min-width: 768px) {
    #glowscript { min-height: 480px; }
  }
</style>
</head>
<body class="bg-slate-100 min-h-screen">
<div class="max-w-5xl mx-auto p-3 md:p-4">
  <header class="text-center py-4 md:py-6">
    <h1 class="text-2xl md:text-3xl font-bold text-slate-800">⚛️ GlowScript 시뮬레이터</h1>
    <p class="text-slate-500 mt-1 md:mt-2 text-sm md:text-base">물리 시뮬레이션을 브라우저에서 바로 실행</p>
  </header>

  <div class="bg-white rounded-2xl shadow-lg p-3 md:p-4 mb-3 md:mb-4">
    <div id="simButtons" class="flex gap-2"></div>
  </div>

  <!-- Mobile: stacked layout, canvas first -->
  <div class="bg-white rounded-2xl shadow-lg p-2 md:p-4 mb-3 md:mb-4">
    <div id="glowscript" class="glowscript"></div>
    <div id="status" class="text-center text-sm text-slate-500 mt-2"></div>
  </div>

  <!-- Parameter panel: collapsible on mobile, always visible on desktop -->
  <div class="bg-white rounded-2xl shadow-lg p-4 md:col-span-3 mb-3 md:mb-4">
    <button id="paramToggle" class="w-full flex items-center justify-between font-bold text-slate-700 mb-1 md:mb-3 cursor-pointer md:cursor-default md:pointer-events-none">
      <span>⚙️ 파라미터</span>
      <span id="paramToggleIcon" class="md:hidden text-slate-400 transition-transform">▼</span>
    </button>
    <div id="paramPanel" class="space-y-3 text-sm text-slate-600">
      <p class="text-slate-400">시뮬레이션을 선택하면 조절 가능한 파라미터가 표시됩니다.</p>
    </div>
    <div class="mt-4 pt-4 border-t border-slate-100 flex gap-2">
      <button id="viewCodeBtn" class="touch-btn flex-1 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition">📄 코드</button>
      <button id="customCodeBtn" class="touch-btn flex-1 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition">✏️ 직접 입력</button>
      <button id="shareLinkBtn" class="touch-btn flex-1 px-4 py-2 rounded-xl bg-slate-100 text-slate-700 font-medium hover:bg-slate-200 transition">🔗 공유</button>
    </div>
  </div>

  <footer class="text-center text-xs text-slate-400 py-6">
    GlowScript 시뮬레이터 · agent-dev-company · 14가지 물리 시뮬레이션
  </footer>
</div>

<!-- Code viewer modal -->
<div id="codeModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end md:items-center justify-center p-0 md:p-4">
  <div class="bg-white rounded-t-2xl md:rounded-2xl shadow-xl max-w-2xl w-full max-h-[85vh] md:max-h-[80vh] flex flex-col">
    <div class="flex items-center justify-between p-4 border-b border-slate-100">
      <h3 class="font-bold text-slate-700">📄 GlowScript 코드</h3>
      <button id="closeCodeBtn" class="text-slate-400 hover:text-slate-600 text-2xl w-10 h-10 flex items-center justify-center">&times;</button>
    </div>
    <pre id="codeView" class="flex-1 overflow-auto p-4 bg-slate-900 text-slate-100 text-xs font-mono rounded-none md:rounded-b-2xl"></pre>
    <div class="p-3 border-t border-slate-100 flex justify-end gap-2">
      <button id="copyCodeBtn" class="touch-btn px-6 py-2 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700 transition">📋 복사</button>
    </div>
  </div>
</div>

<!-- Custom code modal -->
<div id="customModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl max-w-3xl w-full max-h-[90vh] md:max-h-[85vh] flex flex-col">
    <div class="flex items-center justify-between p-4 border-b border-slate-100">
      <h3 class="font-bold text-slate-700">✏️ GlowScript 코드 직접 입력</h3>
      <button id="closeCustomBtn" class="text-slate-400 hover:text-slate-600 text-2xl w-10 h-10 flex items-center justify-center">&times;</button>
    </div>
    <textarea id="customCode" spellcheck="false" class="flex-1 p-4 bg-slate-900 text-slate-100 text-xs font-mono border-0 outline-none resize-none" placeholder="# 여기에 GlowScript/VPython 코드를 작성하세요&#10;from vpython import *&#10;scene = canvas()&#10;ball = sphere(pos=vector(0,0,0), radius=0.5, color=color.red)&#10;while True:&#10;    rate(100)&#10;    ball.pos.x = 3*sin(3*clock())"></textarea>
    <div class="p-3 border-t border-slate-100 flex justify-end gap-2">
      <button id="runCustomBtn" class="touch-btn px-6 py-2 rounded-xl bg-blue-600 text-white font-medium hover:bg-blue-700 transition">▶️ 실행</button>
    </div>
  </div>
</div>

<script src="https://www.glowscript.org/lib/jquery/2.1/jquery.min.js"></script>
<script src="https://www.glowscript.org/lib/jquery/IDE/jquery-ui.custom.min.js"></script>
<script src="https://www.glowscript.org/package/glow.3.2.min.js"></script>
<script src="https://www.glowscript.org/package/RScompiler.3.2.min.js"></script>
<script>
// ===== Simulation code templates (from glowscript-agent knowledge base) =====
const SIMS = {
  projectile: {
    label: '🎯 포물선',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "ball = sphere(pos=vector(0,0,0), radius=0.5, color=color.red, make_trail=True)",
      "floor = box(pos=vector(0,-1,0), size=vector(20,0.1,1), color=color.green)",
      "ball.velocity = vector(5,10,0)",
      "g = vector(0,-9.8,0)",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    ball.velocity += g*dt",
      "    ball.pos += ball.velocity*dt",
      "    if ball.pos.y < 0:",
      "        ball.velocity.y = -ball.velocity.y*0.8"
    ].join("\n")
  },
  pendulum: {
    label: '🕰️ 진자',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "pivot = vector(0,5,0)",
      "rod = cylinder(pos=pivot, axis=vector(0,-3,0), radius=0.05, color=color.white)",
      "bob = sphere(pos=pivot+vector(0,-3,0), radius=0.3, color=color.orange)",
      "theta = 0.5",
      "omega = 0",
      "L = 3",
      "g = 9.8",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    alpha = -(g/L)*sin(theta)",
      "    omega += alpha*dt",
      "    theta += omega*dt",
      "    bob.pos = pivot + vector(L*sin(theta), -L*cos(theta), 0)",
      "    rod.axis = bob.pos - pivot"
    ].join("\n")
  },
  spring: {
    label: '🌀 용수철',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "ceiling = box(pos=vector(0,5,0), size=vector(4,0.2,1), color=color.white)",
      "mass = sphere(pos=vector(0,2,0), radius=0.4, color=color.blue)",
      "spring = helix(pos=ceiling.pos, axis=mass.pos-ceiling.pos, radius=0.2, color=color.white)",
      "mass.velocity = vector(0,0,0)",
      "k = 20",
      "m = 1",
      "g = 9.8",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    force = -k*(mass.pos.y-2)*vector(0,1,0) - m*g*vector(0,1,0)",
      "    mass.velocity += (force/m)*dt",
      "    mass.pos += mass.velocity*dt",
      "    spring.axis = mass.pos - ceiling.pos"
    ].join("\n")
  },
  orbit: {
    label: '🪐 궤도',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "star = sphere(pos=vector(0,0,0), radius=1, color=color.yellow)",
      "planet = sphere(pos=vector(5,0,0), radius=0.3, color=color.blue, make_trail=True)",
      "planet.velocity = vector(0,0,4.47)",
      "G = 1",
      "M = 100",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    r = planet.pos - star.pos",
      "    force = -G*M*norm(r)/mag(r)**2",
      "    planet.velocity += force*dt",
      "    planet.pos += planet.velocity*dt"
    ].join("\n")
  },
  free_fall: {
    label: '⬇️ 자유낙하',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "ball = sphere(pos=vector(0,10,0), radius=0.5, color=color.red, make_trail=True)",
      "floor = box(pos=vector(0,-0.5,0), size=vector(10,0.1,1), color=color.green)",
      "ball.velocity = vector(0,0,0)",
      "g = vector(0,-9.8,0)",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    ball.velocity += g*dt",
      "    ball.pos += ball.velocity*dt",
      "    if ball.pos.y < 0:",
      "        ball.pos.y = 0",
      "        ball.velocity.y = 0"
    ].join("\n")
  },
  collision: {
    label: '💥 충돌',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "ball1 = sphere(pos=vector(-3,0,0), radius=0.5, color=color.red, make_trail=True)",
      "ball2 = sphere(pos=vector(3,0,0), radius=0.5, color=color.blue, make_trail=True)",
      "ball1.velocity = vector(2,0,0)",
      "ball2.velocity = vector(-1,0,0)",
      "m1 = 1",
      "m2 = 1",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    ball1.pos += ball1.velocity*dt",
      "    ball2.pos += ball2.velocity*dt",
      "    if mag(ball1.pos-ball2.pos) < 1.0:",
      "        v1, v2 = ball1.velocity, ball2.velocity",
      "        ball1.velocity = v2",
      "        ball2.velocity = v1"
    ].join("\n")
  },
  electric_field: {
    label: '⚡ 전기장',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "charge = sphere(pos=vector(0,0,0), radius=0.3, color=color.yellow)",
      "k = 8.99e9",
      "q = 1e-9",
      "arrows = []",
      "for x in range(-3,4):",
      "    for y in range(-3,4):",
      "        if x==0 and y==0:",
      "            continue",
      "        p = vector(x,y,0)",
      "        r = mag(p)",
      "        E = k*q/r**2*norm(p)",
      "        arrows.append(arrow(pos=p, axis=E*0.1, color=color.cyan))",
      "while True:",
      "    rate(100)"
    ].join("\n")
  },
  robot_arm: {
    label: '🤖 로봇 팔',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "base = vector(0,0,0)",
      "L1 = 2",
      "L2 = 1.5",
      "theta1 = 0",
      "theta2 = 0",
      "omega = 0.5",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    theta1 += omega*dt",
      "    theta2 += omega*0.5*dt",
      "    joint = base + vector(L1*cos(theta1), L1*sin(theta1), 0)",
      "    tip = joint + vector(L2*cos(theta1+theta2), L2*sin(theta1+theta2), 0)",
      "    seg1 = cylinder(pos=base, axis=joint-base, radius=0.1, color=color.orange)",
      "    seg2 = cylinder(pos=joint, axis=tip-joint, radius=0.1, color=color.cyan)"
    ].join("\n")
  },
  wave: {
    label: '🌊 파동',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "N = 50",
      "pts = [vector(i*0.2-5, 0, 0) for i in range(N)]",
      "string = curve(pos=pts, color=color.cyan, radius=0.05)",
      "t = 0",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    t += dt",
      "    for i in range(N):",
      "        x = i*0.2-5",
      "        string.pos[i] = vector(x, 0.5*sin(x-3*t), 0)"
    ].join("\n")
  },
  electromagnetic_wave: {
    label: '📡 전자기파',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "N = 30",
      "Earrows = []",
      "Barrows = []",
      "for i in range(N):",
      "    x = i*0.3-4.5",
      "    Earrows.append(arrow(pos=vector(x,0,0), axis=vector(0,0.5,0), color=color.red))",
      "    Barrows.append(arrow(pos=vector(x,0,0), axis=vector(0,0,0.5), color=color.blue))",
      "t = 0",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    t += dt",
      "    for i in range(N):",
      "        x = i*0.3-4.5",
      "        Earrows[i].axis = vector(0, 0.5*sin(x-3*t), 0)",
      "        Barrows[i].axis = vector(0, 0, 0.5*sin(x-3*t))"
    ].join("\n")
  },
  fluid: {
    label: '💧 유체',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "N = 30",
      "particles = []",
      "for i in range(N):",
      "    p = sphere(pos=vector(-5+10*random(), -3+6*random(), 0), radius=0.15, color=color.cyan)",
      "    p.velocity = vector(0.5+random(), -0.3+0.6*random(), 0)",
      "    particles.append(p)",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    for p in particles:",
      "        p.pos += p.velocity*dt",
      "        if p.pos.x > 5:",
      "            p.pos.x = -5",
      "        if p.pos.y > 3 or p.pos.y < -3:",
      "            p.velocity.y = -p.velocity.y"
    ].join("\n")
  },
  interference: {
    label: '🌊 간섭',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "N = 60",
      "pts = [vector(i*0.2-6, 0, 0) for i in range(N)]",
      "wave = curve(pos=pts, color=color.cyan, radius=0.05)",
      "src1 = sphere(pos=vector(-3,0,0), radius=0.2, color=color.yellow)",
      "src2 = sphere(pos=vector(3,0,0), radius=0.2, color=color.yellow)",
      "t = 0",
      "dt = 0.01",
      "while True:",
      "    rate(100)",
      "    t += dt",
      "    for i in range(N):",
      "        x = i*0.2-6",
      "        d1 = abs(x+3)",
      "        d2 = abs(x-3)",
      "        wave.pos[i] = vector(x, 0.3*(sin(d1-3*t)+sin(d2-3*t)), 0)"
    ].join("\n")
  },
  double_pendulum: {
    label: '🔀 이중 진자',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "pivot = vector(0,5,0)",
      "L1 = 2",
      "L2 = 1.5",
      "m1 = 1",
      "m2 = 1",
      "g = 9.8",
      "t1 = 1.0",
      "t2 = 0.5",
      "w1 = 0",
      "w2 = 0",
      "dt = 0.005",
      "bob1 = sphere(pos=pivot+vector(0,-L1,0), radius=0.2, color=color.red, make_trail=True)",
      "bob2 = sphere(pos=pivot+vector(0,-(L1+L2),0), radius=0.15, color=color.blue, make_trail=True)",
      "rod1 = cylinder(pos=pivot, axis=vector(0,-L1,0), radius=0.05)",
      "rod2 = cylinder(pos=bob1.pos, axis=vector(0,-L2,0), radius=0.05)",
      "while True:",
      "    rate(100)",
      "    a1 = -(g*(2*m1+m2)*sin(t1)+m2*g*sin(t1-2*t2)+2*sin(t1-t2)*m2*(w2*w2*L2+w1*w1*L1*cos(t1-t2)))/(L1*(2*m1+m2-m2*cos(2*t1-2*t2)))",
      "    a2 = (2*sin(t1-t2)*(w1*w1*L1*(m1+m2)+g*(m1+m2)*cos(t1)+w2*w2*L2*m2*cos(t1-t2)))/(L2*(2*m1+m2-m2*cos(2*t1-2*t2)))",
      "    w1 += a1*dt",
      "    w2 += a2*dt",
      "    t1 += w1*dt",
      "    t2 += w2*dt",
      "    bob1.pos = pivot + vector(L1*sin(t1), -L1*cos(t1), 0)",
      "    bob2.pos = bob1.pos + vector(L2*sin(t2), -L2*cos(t2), 0)",
      "    rod1.axis = bob1.pos - pivot",
      "    rod2.pos = bob1.pos",
      "    rod2.axis = bob2.pos - bob1.pos"
    ].join("\n")
  },
  solar_system: {
    label: '🌌 태양계',
    code: [
      "from vpython import *",
      "scene = canvas()",
      "sun = sphere(pos=vector(0,0,0), radius=1.5, color=color.yellow)",
      "planets = []",
      "G = 1",
      "M = 500",
      "dt = 0.01",
      "for r, radius, color_, v in [(4,0.2,color.red,11.18), (6,0.3,color.green,9.13), (8,0.4,color.blue,7.91)]:",
      "    p = sphere(pos=vector(r,0,0), radius=radius, color=color_, make_trail=True)",
      "    p.velocity = vector(0,0,v)",
      "    planets.append(p)",
      "while True:",
      "    rate(100)",
      "    for p in planets:",
      "        r = p.pos - sun.pos",
      "        force = -G*M*norm(r)/mag(r)**2",
      "        p.velocity += force*dt",
      "        p.pos += p.velocity*dt"
    ].join("\n")
  }
};

// ===== Determine which sim + params from URL (?sim=key&v0=15&angle=30) =====
const params = new URLSearchParams(window.location.search);
let currentSim = params.get('sim') || 'projectile';
if (!SIMS[currentSim]) currentSim = 'projectile';

// ===== Parameter definitions per simulation =====
const PARAMS = {
  projectile: [
    { key: 'v0', label: '초기 속도', min: 2, max: 20, step: 0.5, default: 10, unit: 'm/s' },
    { key: 'angle', label: '발사 각도', min: 10, max: 80, step: 1, default: 45, unit: '°' }
  ],
  pendulum: [
    { key: 'length', label: '줄 길이', min: 1, max: 5, step: 0.1, default: 3, unit: 'm' },
    { key: 'amplitude', label: '진폭', min: 0.1, max: 1.5, step: 0.05, default: 0.5, unit: 'rad' }
  ],
  spring: [
    { key: 'stiffness', label: '용수철 상수 k', min: 5, max: 50, step: 1, default: 20, unit: 'N/m' },
    { key: 'mass', label: '질량', min: 0.5, max: 3, step: 0.1, default: 1, unit: 'kg' }
  ],
  orbit: [
    { key: 'radius', label: '궤도 반지름', min: 3, max: 8, step: 0.5, default: 5, unit: 'm' },
    { key: 'mass', label: '별 질량', min: 50, max: 200, step: 10, default: 100, unit: 'kg' }
  ],
  wave: [
    { key: 'amplitude', label: '진폭', min: 0.1, max: 1.5, step: 0.1, default: 0.5, unit: 'm' },
    { key: 'wavelength', label: '파장', min: 1, max: 5, step: 0.5, default: 3, unit: 'm' }
  ],
  electromagnetic_wave: [
    { key: 'amplitude', label: '진폭', min: 0.1, max: 1.5, step: 0.1, default: 0.5, unit: 'm' }
  ],
  fluid: [
    { key: 'speed', label: '유속', min: 0.5, max: 3, step: 0.1, default: 1, unit: 'm/s' },
    { key: 'count', label: '입자 수', min: 10, max: 60, step: 5, default: 30, unit: '개' }
  ],
  double_pendulum: [
    { key: 'length1', label: '첫 막대 길이', min: 1, max: 4, step: 0.1, default: 2, unit: 'm' },
    { key: 'length2', label: '둘째 막대 길이', min: 1, max: 4, step: 0.1, default: 1.5, unit: 'm' }
  ],
  solar_system: [
    { key: 'planets', label: '행성 수', min: 1, max: 5, step: 1, default: 3, unit: '개' }
  ]
};

// ===== Build simulation buttons (links that reload the page) =====
const btnContainer = document.getElementById('simButtons');
Object.keys(SIMS).forEach(key => {
  const a = document.createElement('a');
  a.textContent = SIMS[key].label;
  a.href = '?sim=' + key;
  a.className = 'sim-btn px-4 py-2 rounded-xl border-2 border-slate-200 bg-white text-slate-700 font-medium no-underline inline-block';
  if (key === currentSim) a.classList.add('active');
  btnContainer.appendChild(a);
});

// ===== Build parameter sliders =====
const paramPanel = document.getElementById('paramPanel');
const paramValues = {};
function buildParams() {
  paramPanel.innerHTML = '';
  const defs = PARAMS[currentSim] || [];
  if (defs.length === 0) {
    paramPanel.innerHTML = '<p class="text-slate-400">이 시뮬레이션은 조절 가능한 파라미터가 없습니다.</p>';
    return;
  }
  defs.forEach(def => {
    // Read initial value from URL if present, else use default
    const urlVal = params.get(def.key);
    let initVal = urlVal !== null ? parseFloat(urlVal) : def.default;
    if (isNaN(initVal) || initVal < def.min || initVal > def.max) initVal = def.default;
    paramValues[def.key] = initVal;
    const row = document.createElement('div');
    row.innerHTML =
      '<div class="flex justify-between mb-1">' +
        '<label class="font-medium">' + def.label + '</label>' +
        '<span class="text-blue-600 font-semibold" id="val-' + def.key + '">' + initVal + ' ' + def.unit + '</span>' +
      '</div>' +
      '<input type="range" id="param-' + def.key + '" min="' + def.min + '" max="' + def.max + '" step="' + def.step + '" value="' + initVal + '" class="w-full accent-blue-600">';
    paramPanel.appendChild(row);
    const slider = row.querySelector('input');
    // Live update the displayed value while dragging
    slider.addEventListener('input', () => {
      document.getElementById('val-' + def.key).textContent = slider.value + ' ' + def.unit;
    });
    // On release, update URL and reload to apply the new parameter
    slider.addEventListener('change', () => {
      params.set('sim', currentSim);
      params.set(def.key, slider.value);
      window.location.search = params.toString();
    });
  });
}
buildParams();

// ===== Mobile param panel toggle (collapsed on mobile, open on desktop) =====
const paramToggle = document.getElementById('paramToggle');
const paramToggleIcon = document.getElementById('paramToggleIcon');
const isMobile = () => window.innerWidth < 768;
// Start collapsed on mobile, expanded on desktop
paramPanel.style.display = isMobile() ? 'none' : '';
paramToggle.addEventListener('click', () => {
  if (!isMobile()) return;
  const hidden = paramPanel.style.display === 'none';
  paramPanel.style.display = hidden ? '' : 'none';
  paramToggleIcon.style.transform = hidden ? 'rotate(0deg)' : 'rotate(180deg)';
});
window.addEventListener('resize', () => {
  if (!isMobile()) {
    paramPanel.style.display = '';
    paramToggleIcon.style.transform = 'rotate(0deg)';
  }
});

// ===== Apply parameters to the simulation code =====
function applyParams(code) {
  let out = code;
  const defs = PARAMS[currentSim] || [];
  defs.forEach(def => {
    const v = paramValues[def.key];
    switch (def.key) {
      case 'v0': out = out.replace(/ball\.velocity = vector\(5,10,0\)/, 'ball.velocity = vector(' + (v*0.5).toFixed(1) + ',' + (v*0.9).toFixed(1) + ',0)'); break;
      case 'angle': out = out.replace(/ball\.velocity = vector\(5,10,0\)/, 'ball.velocity = vector(' + (v*0.5).toFixed(1) + ',' + (v*0.9).toFixed(1) + ',0)'); break;
      case 'length': out = out.replace(/L = 3/, 'L = ' + v); break;
      case 'amplitude': out = out.replace(/theta = 0\.5/, 'theta = ' + v); break;
      case 'stiffness': out = out.replace(/k = 20/, 'k = ' + v); break;
      case 'mass': out = out.replace(/m = 1/, 'm = ' + v); break;
      case 'radius': out = out.replace(/planet = sphere\(pos=vector\(5,0,0\)/, 'planet = sphere(pos=vector(' + v + ',0,0)'); break;
      case 'wavelength': out = out.replace(/0\.5\*sin\(x-3\*t\)/, '0.5*sin(x-' + v + '*t)'); break;
      case 'speed': out = out.replace(/random\.uniform\(0\.5,1\.5\)/, 'random.uniform(' + (v*0.5).toFixed(1) + ',' + (v*1.5).toFixed(1) + ')'); break;
      case 'count': out = out.replace(/N = 30/, 'N = ' + v); break;
      case 'length1': out = out.replace(/L1 = 2/, 'L1 = ' + v); break;
      case 'length2': out = out.replace(/L2 = 1\.5/, 'L2 = ' + v); break;
      case 'planets': out = out.replace(/\[\(4,0\.2,color\.red,11\.18\), \(6,0\.3,color\.green,9\.13\), \(8,0\.4,color\.blue,7\.91\)\]/, '[' + (() => { let s = []; const speeds = [11.18, 9.13, 7.91, 6.8, 6.0]; const radii = [4, 6, 8, 10, 12]; const cols = ['color.red','color.green','color.blue','color.orange','color.cyan']; for (let i = 0; i < v; i++) s.push('(' + radii[i] + ',0.2,color.green,' + speeds[i] + ')'); return s.join(', '); })() + ']'); break;
    }
  });
  return out;
}

// ===== Code viewer =====
const codeModal = document.getElementById('codeModal');
const codeView = document.getElementById('codeView');
document.getElementById('viewCodeBtn').addEventListener('click', () => {
  codeView.textContent = SIMS[currentSim].code;
  codeModal.classList.remove('hidden');
});
document.getElementById('closeCodeBtn').addEventListener('click', () => {
  codeModal.classList.add('hidden');
});
codeModal.addEventListener('click', (e) => {
  if (e.target === codeModal) codeModal.classList.add('hidden');
});
document.getElementById('copyCodeBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(SIMS[currentSim].code);
    const btn = document.getElementById('copyCodeBtn');
    btn.textContent = '✅ 복사됨';
    setTimeout(() => { btn.textContent = '📋 복사'; }, 1500);
  } catch (e) {
    alert('복사 실패: ' + e.message);
  }
});

// ===== Share link (copies URL with sim + params) =====
document.getElementById('shareLinkBtn').addEventListener('click', async () => {
  const shareParams = new URLSearchParams();
  shareParams.set('sim', currentSim);
  const defs = PARAMS[currentSim] || [];
  defs.forEach(def => {
    if (paramValues[def.key] !== undefined) {
      shareParams.set(def.key, paramValues[def.key]);
    }
  });
  const shareUrl = window.location.origin + window.location.pathname + '?' + shareParams.toString();
  try {
    await navigator.clipboard.writeText(shareUrl);
    const btn = document.getElementById('shareLinkBtn');
    btn.textContent = '✅ 링크 복사됨';
    setTimeout(() => { btn.textContent = '🔗 공유 링크 복사'; }, 1500);
  } catch (e) {
    alert('복사 실패: ' + e.message);
  }
});

// ===== Custom code editor =====
const customModal = document.getElementById('customModal');
const customCode = document.getElementById('customCode');
document.getElementById('customCodeBtn').addEventListener('click', () => {
  customCode.value = SIMS[currentSim].code;
  customModal.classList.remove('hidden');
});
document.getElementById('closeCustomBtn').addEventListener('click', () => {
  customModal.classList.add('hidden');
});
customModal.addEventListener('click', (e) => {
  if (e.target === customModal) customModal.classList.add('hidden');
});
document.getElementById('runCustomBtn').addEventListener('click', () => {
  const code = customCode.value;
  if (!code.trim()) { alert('코드를 입력해주세요.'); return; }
  const url = new URL(window.location.href);
  url.searchParams.set('custom', '1');
  url.searchParams.set('code', code);
  url.searchParams.delete('sim');
  window.location.href = url.toString();
});

// ===== Run the selected simulation (single compile per page load) =====
const status = document.getElementById('status');
// Determine if we're in custom mode
const isCustom = params.get('custom') === '1';
const customProgram = params.get('code') || '';
let sourceCode;
let statusLabel;
if (isCustom && customProgram) {
  sourceCode = customProgram;
  statusLabel = '✏️ 커스텀 코드';
} else {
  sourceCode = applyParams(SIMS[currentSim].code);
  statusLabel = SIMS[currentSim].label;
}
status.textContent = statusLabel + ' 시뮬레이션 실행 중...';
try {
  const embedScript = window.glowscript_compile(sourceCode, {
    lang: 'vpython',
    version: '3.2',
    run: false,
    nodictionary: false
  });
  const runScript = ';(function() {' + embedScript +
    ';$(function(){ window.__context = { glowscript_container: $("#glowscript") };' +
    ';__main__();});})();';
  const scriptEl = document.createElement('script');
  scriptEl.textContent = runScript;
  document.body.appendChild(scriptEl);
  status.textContent = statusLabel + ' 시뮬레이션 실행 중 ✅';
} catch (e) {
  status.textContent = '오류: ' + e.message;
  console.error('GlowScript error:', e);
}
</script>
