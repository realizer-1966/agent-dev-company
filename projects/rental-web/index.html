<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>임대관리 앱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .btn { transition: all 0.15s ease; user-select: none; }
    .btn:active { transform: scale(0.96); }
    .card { transition: all 0.2s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -8px rgba(0,0,0,0.4); }
    input, select, textarea { color-scheme: dark; }
    .badge { transition: all 0.2s ease; }
    .badge:hover { transform: scale(1.05); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body class="min-h-screen text-slate-200">

  <!-- 헤더 -->
  <header class="bg-slate-900/80 backdrop-blur border-b border-slate-700 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-extrabold text-white tracking-tight">🏢 임대관리 앱</h1>
      <div class="flex items-center gap-3">
        <span class="hidden sm:inline text-xs text-slate-400" id="saveStatus">로컬 저장</span>
        <button id="newBuildingBtn" class="btn bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold px-4 py-2 rounded-xl">+ 건물 추가</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">

    <!-- 건물 목록 -->
    <section id="buildingList" class="fade-in">
      <div id="buildingsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="emptyBuildings" class="text-center py-16 hidden">
        <p class="text-5xl mb-4">🏢</p>
        <p class="text-lg font-semibold text-slate-300">등록된 건물이 없습니다</p>
        <p class="text-sm text-slate-500 mt-1">"+ 건물 추가" 버튼으로 첫 건물을 등록하세요</p>
      </div>
    </section>

    <!-- 건물 상세 -->
    <section id="buildingDetail" class="hidden fade-in">
      <!-- 뒤로가기 + 건물 정보 -->
      <div class="flex items-center justify-between mb-4">
        <button id="backBtn" class="btn bg-slate-700 hover:bg-slate-600 text-sm font-bold px-3 py-2 rounded-xl">← 뒤로</button>
        <div class="text-right">
          <h2 class="text-xl font-bold text-white" id="detailBuildingName"></h2>
          <p class="text-xs text-slate-400" id="detailBuildingCount"></p>
        </div>
      </div>

      <!-- 건물 공용 비용 -->
      <div class="bg-slate-800 rounded-2xl p-5 mb-6 border border-slate-700">
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-bold text-white">🏢 건물 공용 비용 <span class="text-xs font-normal text-slate-400 ml-1">(공용전기, 하수도 등)</span></h3>
          <div class="text-right">
            <p class="text-xs text-slate-400">누적 공용 비용</p>
            <p class="text-xl font-extrabold text-emerald-400" id="commonCostSum">0원</p>
          </div>
        </div>
        <div class="grid md:grid-cols-3 gap-2 mb-3">
          <input id="ccCostType" placeholder="비용항목 (예: 공용전기, 하수도)" class="col-span-1 bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400"/>
          <input id="ccCost" type="number" min="0" step="0.01" placeholder="비용 (원)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400"/>
          <button id="ccAddBtn" class="btn bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl">+ 공용 비용 기록</button>
        </div>
        <div id="commonCostsList" class="space-y-2 max-h-56 overflow-y-auto"></div>
      </div>

      <!-- 세입자 추가 폼 -->
      <div class="bg-slate-800 rounded-2xl p-5 mb-6 border border-slate-700">
        <h3 class="font-bold text-white mb-4">📝 세입자 등록 <span class="text-xs font-normal text-slate-400 ml-1">(최대 30명)</span></h3>
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-3">
          <input id="tName" placeholder="세입자 이름" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"/>
          <input id="tPhone" placeholder="전화번호 (예: 010-1234-5678)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"/>
          <input id="tRoom" placeholder="호실 (예: 101)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"/>
          <input id="tDeposit" type="number" min="0" placeholder="보증금 (만원)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"/>
          <input id="tRent" type="number" min="0" placeholder="월세 (만원)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"/>
          <input id="tMgmt" type="number" min="0" placeholder="관리비 (만원)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"/>
          <div class="flex flex-col">
            <label class="text-xs text-slate-400 mb-1">📅 입주일</label>
            <input id="tMoveIn" type="date" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"/>
          </div>
          <div class="flex flex-col">
            <label class="text-xs text-slate-400 mb-1">📆 만기일</label>
            <input id="tContractEnd" type="date" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"/>
          </div>
          <button id="addTenantBtn" class="btn bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl">+ 세입자 등록</button>
        </div>
        <p class="text-xs text-slate-500 mt-3">※ 입주일을 입력하면 만기일이 <span class="text-indigo-300 font-bold">입주일 + 2년</span>으로 자동 설정됩니다. 퇴거일은 퇴거 시 수정에서 기록합니다.</p>
      </div>

      <!-- 세입자 목록 -->
      <div id="tenantsGrid" class="grid gap-4"></div>
    </section>

  </main>

  <!-- 건물 추가 모달 -->
  <div id="buildingModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-md border border-slate-700 fade-in">
      <h3 class="font-bold text-white text-lg mb-4">🏢 건물 등록</h3>
      <input id="bName" placeholder="건물 이름 (예: 미소빌딩)" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm mb-3 focus:ring-2 focus:ring-indigo-400"/>
      <input id="bAddr" placeholder="주소 (선택)" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm mb-3 focus:ring-2 focus:ring-indigo-400"/>
      <div class="flex gap-2 justify-end mt-2">
        <button id="bCancel" class="btn bg-slate-700 hover:bg-slate-600 text-sm font-bold px-4 py-2 rounded-xl">취소</button>
        <button id="bSave" class="btn bg-indigo-600 hover:bg-indigo-500 text-sm font-bold px-4 py-2 rounded-xl">저장</button>
      </div>
    </div>
  </div>

  <!-- 세입자 상세/기록 모달 -->
  <div id="tenantModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto border border-slate-700 fade-in">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-white text-lg" id="tmTitle"></h3>
        <button id="tmClose" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
      </div>

      <div class="bg-slate-900 rounded-xl p-4 mb-4 text-sm grid grid-cols-2 gap-2" id="tmInfo"></div>

      <!-- 기록 작성 -->
      <h4 class="font-bold text-white text-sm mb-2">📝 기록 남기기</h4>
      <div class="grid grid-cols-3 gap-2 mb-2">
        <input id="noteCostType" placeholder="비용항목 (예: 수도, 전기)" class="col-span-2 bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400"/>
        <input id="noteCost" type="number" min="0" step="0.01" placeholder="비용 (원)" class="bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400"/>
      </div>
      <textarea id="noteText" rows="2" placeholder="텍스트 기록 (예: 관리비 연체, 시설 점검 등)" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm mb-2 focus:ring-2 focus:ring-indigo-400"></textarea>
      <input id="noteImg" type="file" accept="image/*" class="w-full text-sm text-slate-300 mb-3 file:mr-3 file:bg-indigo-600 file:text-white file:border-0 file:rounded-xl file:px-4 file:py-2 file:font-bold file:cursor-pointer"/>
      <button id="noteAdd" class="btn w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-xl mb-5">기록 추가</button>

      <!-- 호수별 비용 합계 -->
      <div class="bg-indigo-600/20 border border-indigo-500/40 rounded-xl p-3 mb-4 flex items-center justify-between">
        <span class="text-sm font-bold text-white">💰 <span id="costRoomLabel">이 호수</span> 누적 비용</span>
        <span class="text-lg font-extrabold text-emerald-400" id="costSum">0원</span>
      </div>

      <!-- 기록 목록 -->
      <h4 class="font-bold text-white text-sm mb-2">📋 기록 목록</h4>
      <div id="notesList" class="space-y-3"></div>
    </div>
  </div>

  <!-- 세입자 수정 모달 -->
  <div id="editModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto border border-slate-700 fade-in">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-bold text-white text-lg" id="emTitle">✏️ 세입자 수정</h3>
        <button id="emClose" class="text-slate-400 hover:text-white text-2xl leading-none">&times;</button>
      </div>
      <div class="space-y-3">
        <input id="eName" placeholder="세입자 이름" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400"/>
        <input id="ePhone" placeholder="전화번호" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400"/>
        <input id="eRoom" placeholder="호실" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400"/>
        <div class="grid grid-cols-3 gap-2">
          <input id="eDeposit" type="number" min="0" placeholder="보증금" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400"/>
          <input id="eRent" type="number" min="0" placeholder="월세" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400"/>
          <input id="eMgmt" type="number" min="0" placeholder="관리비" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-400"/>
        </div>
        <div class="grid grid-cols-3 gap-2 text-xs">
          <div><label class="text-slate-400 block mb-1">📅 입주일</label><input id="eMoveIn" type="date" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-2 py-2 text-sm focus:ring-2 focus:ring-indigo-400"/></div>
          <div><label class="text-slate-400 block mb-1">📆 만기일</label><input id="eContractEnd" type="date" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-2 py-2 text-sm focus:ring-2 focus:ring-indigo-400"/></div>
          <div><label class="text-slate-400 block mb-1">🚪 퇴거일</label><input id="eMoveOut" type="date" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-2 py-2 text-sm focus:ring-2 focus:ring-indigo-400"/></div>
        </div>
        <p class="text-xs text-slate-500">※ 입주일을 변경하면 만기일이 <span class="text-indigo-300 font-bold">입주일 + 2년</span>으로 자동 설정됩니다. 퇴거일은 비워두면 입주 중입니다.</p>
        <div class="flex gap-2 justify-end pt-2">
          <button id="emCancel" class="btn bg-slate-700 hover:bg-slate-600 text-sm font-bold px-4 py-2 rounded-xl">취소</button>
          <button id="emSave" class="btn bg-indigo-600 hover:bg-indigo-500 text-sm font-bold px-4 py-2 rounded-xl">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============ 데이터 저장 (IndexedDB) ============
    const DB_NAME = 'rental-mgmt';
    const DB_VER = 1;
    let db = null;
    let buildings = [];      // { id, name, addr, tenants: [ ... ] }
    let currentBuildingId = null;
    let currentTenant = null;

    // 건물당 세입자 최대 수
    const MAX_TENANTS = 30;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('buildings')) {
            d.createObjectStore('buildings', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => { db = req.result; resolve(db); };
        req.onerror = () => reject(req.error);
      });
    }

    async function saveBuildings() {
      if (!db) return;
      const tx = db.transaction('buildings', 'readwrite');
      const store = tx.objectStore('buildings');
      store.clear();
      buildings.forEach(b => store.put(b));
      await new Promise((res) => { tx.oncomplete = res; });
      flashSaved();
    }

    async function loadBuildings() {
      if (!db) return;
      const tx = db.transaction('buildings', 'readonly');
      const store = tx.objectStore('buildings');
      const req = store.getAll();
      buildings = await new Promise((res, rej) => { req.onsuccess = () => res(req.result || []); req.onerror = () => rej(req.error); });
    }

    function flashSaved() {
      const el = document.getElementById('saveStatus');
      el.textContent = '저장됨 ✓';
      el.classList.add('text-emerald-400');
      setTimeout(() => { el.textContent = '로컬 저장'; el.classList.remove('text-emerald-400'); }, 1500);
    }

    function genId() {
      return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    }

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    // ============ 포맷팅 ============
    function fmtMoney(v) {
      if (v === null || v === undefined || v === '') return '-';
      return Number(v).toLocaleString('ko-KR') + '만원';
    }
    function fmtDate(d) {
      if (!d) return '-';
      return d;
    }

    // 입주일 기준 계약만료일 = 입주일 + 2년 (YYYY-MM-DD)
    function calcContractEnd(moveIn) {
      if (!moveIn) return '';
      const [y, m, d] = moveIn.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setFullYear(date.getFullYear() + 2);
      const yy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    // 입주일이 바뀌면 계약만료일을 (입주일 + 2년)으로 자동 채움
    function autoFillContractEnd(prefix) {
      const moveIn = document.getElementById(prefix + 'MoveIn').value;
      if (!moveIn) return;
      const end = calcContractEnd(moveIn);
      document.getElementById(prefix + 'ContractEnd').value = end;
    }

    // ============ UI: 건물 목록 ============
    function renderBuildings() {
      const grid = document.getElementById('buildingsGrid');
      const empty = document.getElementById('emptyBuildings');
      grid.innerHTML = '';
      if (buildings.length === 0) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      buildings.forEach((b, idx) => {
        const totalRent = b.tenants.reduce((s, t) => s + (Number(t.rent)||0), 0);
        const activeCount = b.tenants.filter(t => getTenantStatus(t) === 'active').length;
        const colors = ['from-indigo-600 to-purple-600','from-emerald-600 to-teal-600','from-rose-600 to-pink-600','from-amber-500 to-orange-600','from-sky-600 to-blue-600','from-fuchsia-600 to-purple-600'];
        const grad = colors[idx % colors.length];
        grid.innerHTML += `
          <div data-bid="${b.id}" class="card badge cursor-pointer text-left bg-slate-800 border border-slate-700 rounded-2xl p-4 overflow-hidden">
            <div class="flex items-start justify-between">
              <div class="h-1.5 rounded-full bg-gradient-to-r ${grad} mb-3 w-16"></div>
              <button data-bid="${b.id}" data-del class="btn text-slate-500 hover:text-rose-400 hover:bg-rose-500/10 rounded-lg px-2 py-1 text-sm" title="건물 삭제">🗑️</button>
            </div>
            <h3 class="font-bold text-white text-lg truncate">🏢 ${escapeHtml(b.name)}</h3>
            ${b.addr ? `<p class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(b.addr)}</p>` : ''}
            <div class="flex items-center justify-between mt-4">
              <div>
                <p class="text-2xl font-extrabold text-white">${activeCount}<span class="text-sm text-slate-400">/${b.tenants.length}명</span></p>
                <p class="text-xs text-slate-500">입주 중</p>
              </div>
              <div class="text-right">
                <p class="text-sm font-bold text-emerald-400">월 ${fmtMoney(totalRent)}</p>
                <p class="text-xs text-slate-500">월세 합계</p>
              </div>
            </div>
          </div>`;
      });
      // 카드 클릭 → 건물 상세
      grid.querySelectorAll('[data-bid]:not([data-del])').forEach(card => {
        card.addEventListener('click', () => openBuilding(card.dataset.bid));
      });
      // 삭제 버튼 클릭 → 건물 삭제
      grid.querySelectorAll('[data-del]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteBuilding(btn.dataset.bid);
        });
      });
    }

    function deleteBuilding(id) {
      const b = buildings.find(x => x.id === id);
      if (!b) return;
      const msg = `건물 "${b.name}"을(를) 삭제하시겠습니까?\n등록된 세입자 ${b.tenants.length}명의 기록도 함께 삭제됩니다.`;
      if (!confirm(msg)) return;
      buildings = buildings.filter(x => x.id !== id);
      saveBuildings();
      renderBuildings();
    }

    // ============ UI: 건물 상세 ============
    function openBuilding(id) {
      const b = buildings.find(x => x.id === id);
      if (!b) return;
      currentBuildingId = id;
      document.getElementById('buildingList').classList.add('hidden');
      document.getElementById('buildingDetail').classList.remove('hidden');
      document.getElementById('detailBuildingName').textContent = '🏢 ' + b.name;
      document.getElementById('detailBuildingCount').textContent = `세입자 ${b.tenants.length}/30명`;
      if (!b.commonCosts) b.commonCosts = [];
      renderTenants();
      renderCommonCosts();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function backToList() {
      currentBuildingId = null;
      document.getElementById('buildingDetail').classList.add('hidden');
      document.getElementById('buildingList').classList.remove('hidden');
      renderBuildings();
    }

    function renderTenants() {
      const b = buildings.find(x => x.id === currentBuildingId);
      if (!b) return;
      const grid = document.getElementById('tenantsGrid');
      grid.innerHTML = '';
      if (b.tenants.length === 0) {
        grid.innerHTML = `<p class="text-center text-slate-500 py-8">등록된 세입자가 없습니다. 위에서 등록하세요.</p>`;
        return;
      }
      b.tenants.forEach(t => {
        const status = getTenantStatus(t); // 'active' | 'midterm' | 'full'
        let statusBadge;
        if (status === 'active') {
          statusBadge = '<span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2 py-0.5 rounded-full">입주 중</span>';
        } else if (status === 'midterm') {
          statusBadge = '<span class="bg-amber-500/20 text-amber-400 text-xs font-bold px-2 py-0.5 rounded-full">⚠ 중도 퇴거</span>';
        } else {
          statusBadge = '<span class="bg-slate-500/20 text-slate-400 text-xs font-bold px-2 py-0.5 rounded-full">만기일 퇴거</span>';
        }
        grid.innerHTML += `
          <div class="card bg-slate-800 border border-slate-700 rounded-2xl p-5">
            <div class="flex items-start justify-between">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold text-lg shrink-0">
                  ${escapeHtml((t.name||'?').charAt(0))}
                </div>
                <div>
                  <h4 class="font-bold text-white">${escapeHtml(t.name)} <span class="text-slate-400 text-sm font-normal">${escapeHtml(t.room||'')}</span></h4>
                  <p class="text-xs text-slate-400 mt-0.5">📞 ${escapeHtml(t.phone||'-')}</p>
                </div>
              </div>
              ${statusBadge}
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4 text-center">
              <div class="bg-slate-900 rounded-xl py-2">
                <p class="text-xs text-slate-400">보증금</p>
                <p class="text-sm font-bold text-white mt-0.5">${fmtMoney(t.deposit)}</p>
              </div>
              <div class="bg-slate-900 rounded-xl py-2">
                <p class="text-xs text-slate-400">월세</p>
                <p class="text-sm font-bold text-white mt-0.5">${fmtMoney(t.rent)}</p>
              </div>
              <div class="bg-slate-900 rounded-xl py-2">
                <p class="text-xs text-slate-400">관리비</p>
                <p class="text-sm font-bold text-white mt-0.5">${fmtMoney(t.mgmt)}</p>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-2 mt-4 text-center text-xs">
              <div class="bg-slate-900 rounded-lg py-1.5">
                <p class="text-slate-500">📅 입주일</p>
                <p class="text-slate-200 font-semibold mt-0.5">${fmtDate(t.moveIn)}</p>
              </div>
              <div class="bg-slate-900 rounded-lg py-1.5">
                <p class="text-slate-500">📆 만기일</p>
                <p class="text-indigo-300 font-semibold mt-0.5">${t.contractEnd ? fmtDate(t.contractEnd) : '-'}</p>
              </div>
              <div class="bg-slate-900 rounded-lg py-1.5">
                <p class="text-slate-500">🚪 퇴거일</p>
                <p class="text-slate-200 font-semibold mt-0.5">${fmtDate(t.moveOut)}</p>
              </div>
            </div>
            <div class="flex gap-2 mt-4">
              <button data-tid="${t.id}" data-act="detail" class="btn flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold py-2 rounded-xl">📋 기록 ${t.notes ? t.notes.length : 0}건</button>
              <button data-tid="${t.id}" data-act="edit" class="btn bg-amber-500/80 hover:bg-amber-400 text-white text-sm font-bold px-3 py-2 rounded-xl">✏️ 수정</button>
              <button data-tid="${t.id}" data-act="del" class="btn bg-rose-600/80 hover:bg-rose-500 text-white text-sm font-bold px-4 py-2 rounded-xl">삭제</button>
            </div>
          </div>`;
      });
      grid.querySelectorAll('[data-tid]').forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.act === 'detail') openTenant(btn.dataset.tid);
          else if (btn.dataset.act === 'edit') openEditModal(btn.dataset.tid);
          else if (btn.dataset.act === 'del') deleteTenant(btn.dataset.tid);
        });
      });
    }

    // ============ 건물 공용 비용 ============
    function renderCommonCosts() {
      const b = buildings.find(x => x.id === currentBuildingId);
      if (!b) return;
      if (!b.commonCosts) b.commonCosts = [];
      const list = document.getElementById('commonCostsList');
      list.innerHTML = '';
      const total = b.commonCosts.reduce((s, c) => s + (Number(c.cost) || 0), 0);
      document.getElementById('commonCostSum').textContent = total ? total.toLocaleString('ko-KR') + '원' : '0원';
      if (b.commonCosts.length === 0) {
        list.innerHTML = '<p class="text-xs text-slate-500">아직 공용 비용 기록이 없습니다.</p>';
        return;
      }
      b.commonCosts.forEach(c => {
        const date = new Date(c.createdAt).toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
        list.innerHTML += `
          <div class="bg-slate-900 rounded-xl px-3 py-2 border border-slate-700 flex items-center justify-between">
            <div>
              <span class="text-sm font-bold text-white">${escapeHtml(c.type || '비용')}</span>
              <span class="text-xs text-slate-400 ml-2">${date}</span>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-sm font-bold text-emerald-400">${Number(c.cost).toLocaleString('ko-KR')}원</span>
              <button data-ccid="${c.id}" class="text-rose-400 hover:text-rose-300 text-xs">삭제</button>
            </div>
          </div>`;
      });
      list.querySelectorAll('[data-ccid]').forEach(btn => {
        btn.addEventListener('click', () => deleteCommonCost(btn.dataset.ccid));
      });
    }

    function addCommonCost() {
      const b = buildings.find(x => x.id === currentBuildingId);
      if (!b) return;
      const type = document.getElementById('ccCostType').value.trim();
      const costVal = document.getElementById('ccCost').value;
      const cost = costVal === '' ? null : Number(costVal);
      if (cost === null || isNaN(cost)) { alert('공용 비용 금액을 입력하세요.'); return; }
      if (!b.commonCosts) b.commonCosts = [];
      b.commonCosts.unshift({ id: genId(), type: type || '기타', cost, createdAt: Date.now() });
      saveBuildings();
      renderCommonCosts();
      document.getElementById('ccCostType').value = '';
      document.getElementById('ccCost').value = '';
    }

    function deleteCommonCost(cid) {
      const b = buildings.find(x => x.id === currentBuildingId);
      if (!b) return;
      if (!confirm('이 공용 비용 기록을 삭제하시겠습니까?')) return;
      b.commonCosts = b.commonCosts.filter(c => c.id !== cid);
      saveBuildings();
      renderCommonCosts();
    }

    // 세입자 상태 판정 (현재 날짜 기준)
    // - active  : 퇴거일이 비었거나, 퇴거일이 오늘보다 이후 (입주 중)
    // - midterm : 퇴거일 < 계약만료일 (중도 퇴거)
    // - full    : 계약만료일에 맞춰 퇴거 (계약만료 퇴거)
    function getTenantStatus(t) {
      const today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
      if (!t.moveOut) return 'active';               // 퇴거일 미정 → 입주 중
      if (t.moveOut >= today) return 'active';       // 아직 퇴거일 안 지남 → 입주 중
      // 과거에 퇴거함 → 중도/만료 판정
      if (t.contractEnd && t.moveOut < t.contractEnd) return 'midterm'; // 계약만료보다 일찍 퇴거
      return 'full'; // 계약만료일까지 살고 퇴거
    }

    // ============ 세입자 수정 ============
    let editTenantId = null;

    function openEditModal(tid) {
      const b = buildings.find(x => x.id === currentBuildingId);
      if (!b) return;
      const t = b.tenants.find(x => x.id === tid);
      if (!t) return;
      editTenantId = tid;
      document.getElementById('eName').value = t.name || '';
      document.getElementById('ePhone').value = t.phone || '';
      document.getElementById('eRoom').value = t.room || '';
      document.getElementById('eDeposit').value = t.deposit || '';
      document.getElementById('eRent').value = t.rent || '';
      document.getElementById('eMgmt').value = t.mgmt || '';
      document.getElementById('eMoveIn').value = t.moveIn || '';
      document.getElementById('eContractEnd').value = t.contractEnd || '';
      document.getElementById('eMoveOut').value = t.moveOut || '';
      document.getElementById('emTitle').textContent = `✏️ ${t.name} 님 수정`;
      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('editModal').classList.add('flex');
    }

    function closeEditModal() {
      editTenantId = null;
      document.getElementById('editModal').classList.add('hidden');
      document.getElementById('editModal').classList.remove('flex');
    }

    function saveEditTenant() {
      if (!editTenantId) return;
      const b = buildings.find(x => x.id === currentBuildingId);
      if (!b) return;
      const t = b.tenants.find(x => x.id === editTenantId);
      if (!t) return;
      const name = document.getElementById('eName').value.trim();
      if (!name) { alert('세입자 이름을 입력하세요.'); return; }
      t.name = name;
      t.phone = document.getElementById('ePhone').value.trim();
      t.room = document.getElementById('eRoom').value.trim();
      t.deposit = document.getElementById('eDeposit').value;
      t.rent = document.getElementById('eRent').value;
      t.mgmt = document.getElementById('eMgmt').value;
      t.moveIn = document.getElementById('eMoveIn').value;
      // 계약만료일: 입력값 우선, 비었으면 입주일 + 2년 자동 계산
      t.contractEnd = document.getElementById('eContractEnd').value || calcContractEnd(t.moveIn);
      t.moveOut = document.getElementById('eMoveOut').value || '';
      saveBuildings();
      renderTenants();
      closeEditModal();
    }

    // ============ 세입자 CRUD ============
    function addTenant() {
      const b = buildings.find(x => x.id === currentBuildingId);
      if (!b) return;
      if (b.tenants.length >= MAX_TENANTS) { alert('세입자는 건물당 최대 30명까지 등록할 수 있습니다.'); return; }
      const name = document.getElementById('tName').value.trim();
      if (!name) { alert('세입자 이름을 입력하세요.'); return; }
      const moveIn = document.getElementById('tMoveIn').value;
      const contractEnd = document.getElementById('tContractEnd').value || calcContractEnd(moveIn);
      const tenant = {
        id: genId(),
        name,
        phone: document.getElementById('tPhone').value.trim(),
        room: document.getElementById('tRoom').value.trim(),
        deposit: document.getElementById('tDeposit').value,
        rent: document.getElementById('tRent').value,
        mgmt: document.getElementById('tMgmt').value,
        moveIn,
        contractEnd, // 계약만료일 (자동: 입주일 + 2년)
        moveOut: '', // 등록 시 퇴거일 미기록, 퇴거 시 수정으로 기록
        notes: [],
        createdAt: Date.now()
      };
      b.tenants.push(tenant);
      saveBuildings();
      renderTenants();
      // 폼 초기화
      ['tName','tPhone','tRoom','tDeposit','tRent','tMgmt','tMoveIn','tContractEnd'].forEach(id => document.getElementById(id).value = '');
    }

    function deleteTenant(tid) {
      if (!confirm('이 세입자를 삭제하시겠습니까? 기록도 함께 삭제됩니다.')) return;
      const b = buildings.find(x => x.id === currentBuildingId);
      if (!b) return;
      b.tenants = b.tenants.filter(t => t.id !== tid);
      saveBuildings();
      renderTenants();
    }

    // ============ 세입자 상세/기록 ============
    function openTenant(tid) {
      const b = buildings.find(x => x.id === currentBuildingId);
      if (!b) return;
      const t = b.tenants.find(x => x.id === tid);
      if (!t) return;
      currentTenant = t;
      document.getElementById('tmTitle').textContent = `${t.name} 님 기록`;
      document.getElementById('tmInfo').innerHTML = `
        <span class="text-slate-400">📞 전화번호</span><span class="text-white text-right">${escapeHtml(t.phone||'-')}</span>
        <span class="text-slate-400">🏠 호실</span><span class="text-white text-right">${escapeHtml(t.room||'-')}</span>
        <span class="text-slate-400">💰 보증금</span><span class="text-white text-right">${fmtMoney(t.deposit)}</span>
        <span class="text-slate-400">📆 월세</span><span class="text-white text-right">${fmtMoney(t.rent)}</span>
        <span class="text-slate-400">🧾 관리비</span><span class="text-white text-right">${fmtMoney(t.mgmt)}</span>
        <span class="text-slate-400">📅 입주일</span><span class="text-white text-right">${fmtDate(t.moveIn)}</span>
        <span class="text-slate-400">📆 만기일</span><span class="text-white text-right">${fmtDate(t.contractEnd)}</span>
        <span class="text-slate-400">🚪 퇴거일</span><span class="text-white text-right">${fmtDate(t.moveOut)}</span>`;
      document.getElementById('tenantModal').classList.remove('hidden');
      document.getElementById('tenantModal').classList.add('flex');
      // 호수 라벨 설정 (호실이 없으면 세입자 이름으로 표시)
      const roomLabel = t.room ? `${t.room}호` : `${t.name} 님`;
      document.getElementById('costRoomLabel').textContent = roomLabel;
      renderNotes();
    }

    function closeTenant() {
      currentTenant = null;
      const m = document.getElementById('tenantModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function addNote() {
      if (!currentTenant) return;
      const text = document.getElementById('noteText').value.trim();
      const costType = document.getElementById('noteCostType').value.trim();
      const costVal = document.getElementById('noteCost').value;
      const cost = costVal === '' || costVal === null ? null : Number(costVal);
      const imgInput = document.getElementById('noteImg');
      const imgFile = imgInput.files[0];
      if (!text && !imgFile && cost === null) { alert('비용, 텍스트 또는 이미지 중 하나를 입력하세요.'); return; }
      if (cost !== null && isNaN(cost)) { alert('비용은 숫자로 입력하세요.'); return; }
      const note = { id: genId(), text, costType, cost, image: null, createdAt: Date.now() };
      const commit = () => {
        currentTenant.notes = currentTenant.notes || [];
        currentTenant.notes.unshift(note);
        saveBuildings();
        renderNotes();
      };
      if (imgFile) {
        const reader = new FileReader();
        reader.onload = () => { note.image = reader.result; commit(); };
        reader.readAsDataURL(imgFile);
      } else {
        commit();
      }
      document.getElementById('noteText').value = '';
      document.getElementById('noteCostType').value = '';
      document.getElementById('noteCost').value = '';
      imgInput.value = '';
    }

    function deleteNote(noteId) {
      if (!currentTenant) return;
      if (!confirm('이 기록을 삭제하시겠습니까?')) return;
      currentTenant.notes = currentTenant.notes.filter(n => n.id !== noteId);
      saveBuildings();
      renderNotes();
    }

    function renderNotes() {
      const list = document.getElementById('notesList');
      list.innerHTML = '';
      const notes = currentTenant.notes || [];
      // 누적 비용 합계 갱신
      const total = notes.reduce((s, n) => s + (Number(n.cost) || 0), 0);
      document.getElementById('costSum').textContent = total ? total.toLocaleString('ko-KR') + '원' : '0원';
      if (notes.length === 0) {
        list.innerHTML = '<p class="text-center text-slate-500 text-sm py-6">아직 기록이 없습니다.</p>';
        return;
      }
      notes.forEach(n => {
        const date = new Date(n.createdAt).toLocaleString('ko-KR', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
        const costHtml = (n.cost !== null && n.cost !== undefined)
          ? `<span class="text-sm font-bold text-emerald-400">${n.costType ? escapeHtml(n.costType) + ' ' : ''}${Number(n.cost).toLocaleString('ko-KR')}원</span>`
          : '';
        list.innerHTML += `
          <div class="bg-slate-900 rounded-xl p-3 border border-slate-700">
            <div class="flex items-center justify-between mb-1">
              <span class="text-xs text-slate-400">${date}</span>
              <button data-nid="${n.id}" class="text-rose-400 hover:text-rose-300 text-xs">삭제</button>
            </div>
            ${costHtml ? `<div class="mb-2">${costHtml}</div>` : ''}
            ${n.text ? `<p class="text-sm text-slate-200 whitespace-pre-wrap mb-2">${escapeHtml(n.text)}</p>` : ''}
            ${n.image ? `<img src="${n.image}" class="w-full max-h-64 object-cover rounded-lg mt-1 cursor-pointer" onclick="window.open(this.src)"/>` : ''}
          </div>`;
      });
      list.querySelectorAll('[data-nid]').forEach(btn => {
        btn.addEventListener('click', () => deleteNote(btn.dataset.nid));
      });
    }

    // ============ 건물 CRUD ============
    function showBuildingModal() {
      document.getElementById('buildingModal').classList.remove('hidden');
      document.getElementById('buildingModal').classList.add('flex');
      document.getElementById('bName').focus();
    }
    function hideBuildingModal() {
      document.getElementById('buildingModal').classList.add('hidden');
      document.getElementById('buildingModal').classList.remove('flex');
      document.getElementById('bName').value = '';
      document.getElementById('bAddr').value = '';
    }
    function saveBuilding() {
      const name = document.getElementById('bName').value.trim();
      if (!name) { alert('건물 이름을 입력하세요.'); return; }
      const b = { id: genId(), name, addr: document.getElementById('bAddr').value.trim(), tenants: [], commonCosts: [] };
      buildings.push(b);
      saveBuildings();
      renderBuildings();
      hideBuildingModal();
    }

    // ============ 이벤트 ============
    document.getElementById('newBuildingBtn').addEventListener('click', showBuildingModal);
    document.getElementById('bCancel').addEventListener('click', hideBuildingModal);
    document.getElementById('bSave').addEventListener('click', saveBuilding);
    document.getElementById('addTenantBtn').addEventListener('click', addTenant);
    document.getElementById('ccAddBtn').addEventListener('click', addCommonCost);
    document.getElementById('backBtn').addEventListener('click', backToList);
    document.getElementById('tmClose').addEventListener('click', closeTenant);
    document.getElementById('noteAdd').addEventListener('click', addNote);
    document.getElementById('emClose').addEventListener('click', closeEditModal);
    document.getElementById('emCancel').addEventListener('click', closeEditModal);
    document.getElementById('emSave').addEventListener('click', saveEditTenant);
    // 모달 밖 클릭 시 닫기
    document.getElementById('buildingModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) hideBuildingModal(); });
    document.getElementById('tenantModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeTenant(); });
    document.getElementById('editModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeEditModal(); });

    // 입주일 변경 시 계약만료일 = 입주일 + 2년 자동 설정 (등록 폼 / 수정 모달)
    document.getElementById('tMoveIn').addEventListener('change', () => autoFillContractEnd('t'));
    document.getElementById('eMoveIn').addEventListener('change', () => autoFillContractEnd('e'));

    // ============ 초기화 ============
    async function init() {
      try {
        await openDB();
        await loadBuildings();
      } catch (err) {
        console.error('DB 열기 실패', err);
      }
      renderBuildings();
    }
    init();
  </script>
</body>
</html>
