<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>야!동하자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%); font-family: -apple-system, sans-serif; }
    .tab-btn.active { color: #fb923c; }
    .tab-btn.active .tab-icon { transform: scale(1.15); }
  </style>
</head>
<body class="text-white min-h-screen">
  <div class="max-w-md mx-auto min-h-screen flex flex-col">
    <!-- 헤더 -->
    <header class="px-4 pt-4 pb-2 flex items-center justify-between">
      <h1 class="text-xl font-black">야!동하자</h1>
      <div id="streakBadge" class="text-sm text-orange-300 font-bold"></div>
    </header>

    <!-- 상태 표시 -->
    <div id="status" class="px-4 mb-2 text-xs text-slate-400"></div>

    <!-- 메인 콘텐츠 -->
    <main id="main" class="flex-1 px-4 pb-24 overflow-y-auto"></main>

    <!-- 하단 탭바 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur border-t border-slate-700">
      <div class="max-w-md mx-auto grid grid-cols-6">
        <button class="tab-btn active py-3 flex flex-col items-center" data-tab="today">
          <span class="tab-icon text-xl">🏠</span><span class="text-[10px]">오늘</span>
        </button>
        <button class="tab-btn py-3 flex flex-col items-center" data-tab="history">
          <span class="tab-icon text-xl">📊</span><span class="text-[10px]">기록</span>
        </button>
        <button class="tab-btn py-3 flex flex-col items-center" data-tab="mate">
          <span class="tab-icon text-xl">🤝</span><span class="text-[10px]">메이트</span>
        </button>
        <button class="tab-btn py-3 flex flex-col items-center" data-tab="mission">
          <span class="tab-icon text-xl">🎯</span><span class="text-[10px]">미션</span>
        </button>
        <button class="tab-btn py-3 flex flex-col items-center" data-tab="achieve">
          <span class="tab-icon text-xl">🏆</span><span class="text-[10px]">달성</span>
        </button>
        <button class="tab-btn py-3 flex flex-col items-center" data-tab="profile">
          <span class="tab-icon text-xl">👤</span><span class="text-[10px]">프로필</span>
        </button>
      </div>
    </nav>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
