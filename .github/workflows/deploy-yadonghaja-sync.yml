name: Deploy yadonghaja Sync Server (Cloudflare Workers)

on:
  push:
    branches: [ "main" ]
    paths:
      - "projects/yadonghaja/sync-server/**"
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/yadonghaja/sync-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # D1 데이터베이스는 이미 생성됨 (wrangler.toml에 database_id 고정: f1c5ff79-...)
      # R2 버킷이 없으면 생성
      - name: Ensure R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if npx wrangler r2 bucket list 2>/dev/null | grep -q "yadonghaja-blobs"; then
            echo "R2 버킷 이미 존재"
          else
            echo "R2 버킷 생성..."
            npx wrangler r2 bucket create yadonghaja-blobs
          fi

      # D1 마이그레이션 적용 (원격)
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply yadonghaja-sync --remote

      # 시크릿 설정 (wrangler secret put은 대화형 → echo로 파이프)
      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_HMAC_KEY: ${{ secrets.SYNC_HMAC_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "$SYNC_HMAC_KEY" | npx wrangler secret put SYNC_HMAC_KEY
          echo "$R2_ACCOUNT_ID" | npx wrangler secret put R2_ACCOUNT_ID
          echo "$R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID
          echo "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY

      # Workers 배포
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
