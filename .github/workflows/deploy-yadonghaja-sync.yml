name: Deploy yadonghaja Sync Server (Cloudflare Workers)

on:
  push:
    branches: [ "main" ]
    paths:
      - "projects/yadonghaja/sync-server/**"
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/yadonghaja/sync-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      # D1 데이터베이스가 없으면 생성하고, 생성된 database_id를 wrangler.toml에 반영
      - name: Ensure D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          # 이미 database_id가 설정되어 있으면 스킵
          if grep -q "00000000-0000-0000-0000-000000000000" wrangler.toml; then
            echo "D1 database_id가 placeholder입니다. 생성 시도..."
            # 기존 DB 확인
            EXISTING=$(npx wrangler d1 list --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(next((x['database_id'] for x in d if x['name']=='yadonghaja-sync'), ''))" 2>/dev/null || echo "")
            if [ -n "$EXISTING" ]; then
              echo "기존 D1 발견: $EXISTING"
              sed -i "s/00000000-0000-0000-0000-000000000000/$EXISTING/" wrangler.toml
            else
              echo "새 D1 생성..."
              CREATE_OUT=$(npx wrangler d1 create yadonghaja-sync 2>&1)
              echo "$CREATE_OUT"
              NEW_ID=$(echo "$CREATE_OUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
              if [ -z "$NEW_ID" ]; then
                echo "❌ D1 database_id를 파싱하지 못했습니다."
                exit 1
              fi
              echo "새 D1 생성됨: $NEW_ID"
              sed -i "s/00000000-0000-0000-0000-000000000000/$NEW_ID/" wrangler.toml
            fi
          else
            echo "D1 database_id 이미 설정됨"
          fi
          echo "--- wrangler.toml의 database_id ---"
          grep "database_id" wrangler.toml

      # R2 버킷이 없으면 생성
      - name: Ensure R2 bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if npx wrangler r2 bucket list 2>/dev/null | grep -q "yadonghaja-blobs"; then
            echo "R2 버킷 이미 존재"
          else
            echo "R2 버킷 생성..."
            npx wrangler r2 bucket create yadonghaja-blobs
          fi

      # D1 마이그레이션 적용 (원격)
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply yadonghaja-sync --remote

      # 시크릿 설정 (wrangler secret put은 대화형 → echo로 파이프)
      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_HMAC_KEY: ${{ secrets.SYNC_HMAC_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          echo "$SYNC_HMAC_KEY" | npx wrangler secret put SYNC_HMAC_KEY
          echo "$R2_ACCOUNT_ID" | npx wrangler secret put R2_ACCOUNT_ID
          echo "$R2_ACCESS_KEY_ID" | npx wrangler secret put R2_ACCESS_KEY_ID
          echo "$R2_SECRET_ACCESS_KEY" | npx wrangler secret put R2_SECRET_ACCESS_KEY

      # Workers 배포
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy
