name: Cloud Office Dispatcher

on:
  schedule:
    - cron: "*/15 * * * *"   # 15분마다 (비용 확인 후 조정)
  workflow_dispatch:          # 수동 실행
  issues:
    types: [opened, labeled, unlabeled, closed]  # Issue 이벤트 트리거

# 동시성 직렬화 (DB 충돌 방지) - 필수
concurrency:
  group: cloud-office
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  OLLAMA_CLOUD_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- Hermes 설치 (캐시로 가속) ---
      - name: Cache Hermes
        id: cache-hermes
        uses: actions/cache@v4
        with:
          path: ~/.hermes
          key: hermes-${{ runner.os }}-v1

      - name: Install Hermes
        run: |
          pip install -U hermes-agent
          hermes --version

      # --- Hermes 설정: 모델 API 키 ---
      - name: Configure Hermes
        env:
          MODEL_API_KEY: ${{ secrets.OLLAMA_CLOUD_API_KEY }}
        run: |
          hermes config set model.provider ollama-cloud
          if [ -n "$MODEL_API_KEY" ]; then
            hermes config set model.api_key "$MODEL_API_KEY"
          fi
          hermes profile list

      # --- kanban.db 상태 불러오기 ---
      - name: Load kanban state
        run: |
          mkdir -p /root/.hermes
          if [ -f state/kanban.db ]; then
            cp state/kanban.db /root/.hermes/kanban.db
            echo "Loaded existing kanban.db"
          else
            echo "No existing kanban.db, starting fresh"
          fi

      # --- Issue → kanban 동기화 + 디스패처 1회 실행 ---
      - name: Sync issues and dispatch
        run: |
          python scripts/sync_issues.py sync --repo "$REPO"
          echo "--- dispatch ---"
          hermes kanban dispatch --once
          echo "--- status ---"
          hermes kanban list

      # --- kanban.db 상태 저장 + 커밋 ---
      - name: Commit kanban state
        run: |
          mkdir -p state
          if [ -f /root/.hermes/kanban.db ]; then
            cp /root/.hermes/kanban.db state/kanban.db
          fi
          git config user.name "Agent Dev Company"
          git config user.email "office@agent-company.local"
          git add state/kanban.db
          git commit -m "chore: kanban state sync [skip ci]" || echo "No changes to commit"
          git push origin main
