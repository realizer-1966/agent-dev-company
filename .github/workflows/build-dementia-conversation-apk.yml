name: Build Dementia Conversation APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'projects/dementia-conversation/Android/**'
      - 'projects/dementia-conversation/web/**'
      - '.github/workflows/build-dementia-conversation-apk.yml'
  workflow_dispatch:   # 수동 실행 버튼

jobs:
  build_apk:
    name: Build APK (마음이)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projects/dementia-conversation/Android/src

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"

      # WebUI(web/)를 APK assets 로 동기화한다.
      # 이 단계가 없으면 web/ 수정이 앱에 반영되지 않고 조용히 어긋난다.
      # 주의: working-directory 가 Android/src 이므로 상대경로 ../web 은 틀린다.
      #       (그건 Android/web 을 가리킨다) → 저장소 루트 기준 절대경로를 쓴다.
      - name: Sync WebUI into app assets
        run: |
          PROJ="$GITHUB_WORKSPACE/projects/dementia-conversation"
          DEST="$PROJ/Android/src/app/src/main/assets"
          SRC="$PROJ/web"
          mkdir -p "$DEST"
          cp "$SRC/index.html" "$SRC/manifest.json" "$SRC/sw.js" \
             "$SRC/icon-192.png" "$SRC/icon-512.png" "$DEST/"
          echo "--- 동기화 결과 ---"
          ls -la "$DEST"

      # assets 와 web/ 이 실제로 일치하는지 확인 (드리프트 방지)
      - name: Verify assets match web source
        run: |
          PROJ="$GITHUB_WORKSPACE/projects/dementia-conversation"
          for f in index.html manifest.json sw.js icon-192.png icon-512.png; do
            if ! cmp -s "$PROJ/web/$f" "$PROJ/Android/src/app/src/main/assets/$f"; then
              echo "::error::assets/$f 가 web/$f 와 다릅니다"
              exit 1
            fi
          done
          echo "assets == web"

      - name: Build
        run: ./gradlew assembleRelease --stacktrace

      - name: Show APK
        run: ls -la app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dementia-conversation-apk
          path: projects/dementia-conversation/Android/src/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
